<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11131b">
<meta name="author" content="Nazwa Fitriyana">
<meta name="description" content="Kancil PHP Quest: game belajar PHP dari nol, dibuat oleh Nazwa Fitriyana.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kancil PHP Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: game shell — left nav · center stage (map / lesson) · right profile; collapses to top bar + bottom tabs on phones */
:root {
  --bg: #11131b; --panel: #191c27; --panel2: #222636; --line: #363c54; --line2: #4a5172;
  --ink: #ece8d9; --muted: #9196ab; --gold: #f2c14e; --gold2: #b98a1f; --indigo: #7d82ef; --indigo2: #4d52b8;
  --good: #63d690; --bad: #ff6f6f; --code-bg: #0d0f15; --kw: #c49bff; --str: #9be28a; --var: #ffcf7a; --num: #ff9e7a; --cm: #6b7190; --fn: #7fc8ff;
  --f-pixel: 'Pixelify Sans', 'Courier New', monospace; --f-dlg: 'VT323', 'Courier New', monospace; --f-code: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-pixel); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
/* app bar */
.appbar { display: flex; align-items: center; gap: 18px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 3px solid var(--line); position: relative; z-index: 8; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 2px 4px; text-align: left; flex: none; }
.brand canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.brand b { display: block; font-size: 18px; line-height: 1; letter-spacing: .5px; }
.brand small { display: block; font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
.toptabs { display: flex; gap: 4px; flex: 1; min-width: 0; justify-content: center; }
.toptabs button { display: flex; align-items: center; gap: 8px; background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font-size: 15px; color: var(--muted); white-space: nowrap; }
.toptabs button svg { width: 18px; height: 18px; flex: none; }
.toptabs button:hover { color: var(--ink); }
.toptabs button.on { color: var(--gold); border-bottom-color: var(--gold); background: linear-gradient(180deg, transparent 60%, rgba(242,193,78,.08)); }
.abstats { display: flex; align-items: center; gap: 8px; flex: none; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 2px solid var(--line2); padding: 5px 9px; font-variant-numeric: tabular-nums; font-size: 15px; }
.chip svg { width: 16px; height: 16px; }
.lvchip { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 2px solid var(--line2); padding: 3px 10px 3px 4px; }
.lvchip:hover { border-color: var(--gold); }
.lvchip canvas { width: 30px; height: 30px; image-rendering: pixelated; }
.lvt { display: flex; flex-direction: column; gap: 3px; min-width: 64px; text-align: left; }
.lvt b { font-size: 13px; white-space: nowrap; }
.mini { display: block; height: 6px; background: var(--code-bg); border: 1px solid var(--line2); position: relative; }
.mini i { position: absolute; inset: 0 auto 0 0; background: var(--gold); }
.iconbtn { display: grid; place-items: center; width: 38px; height: 38px; background: var(--panel2); border: 2px solid var(--line2); color: var(--muted); }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
/* shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.dash { display: none; }
@media (min-width: 1100px) {
  body[data-view="peta"] .shell { grid-template-columns: 330px minmax(0, 1fr); }
  body[data-view="peta"] .dash { display: flex; }
  body[data-view="peta"] .maphead, body[data-view="peta"] .mapwrap { max-width: 700px; }
}
.dash { flex-direction: column; gap: 12px; padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; overflow-y: auto; min-height: 0; background: linear-gradient(90deg, var(--bg), var(--bg)); border-right: 3px solid var(--line); }
.dc { background: var(--panel); border: 3px solid var(--line2); padding: 14px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.dc h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.cont { border-color: var(--gold2); background: linear-gradient(180deg, #2a2618 0, var(--panel) 70%); }
.cont .eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
.cont .ct { font-size: 22px; margin: 6px 0 2px; line-height: 1.1; text-wrap: balance; }
.cont .cs { font-family: var(--f-dlg); font-size: 19px; color: var(--muted); }
.cont .cprog { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cont .cprog .bar { flex: 1; margin: 0; }
.cont .px { width: 100%; }
.profrow { display: flex; align-items: center; gap: 12px; }
.profrow canvas { width: 56px; height: 56px; image-rendering: pixelated; background: var(--panel2); border: 2px solid var(--line2); }
.lvname { font-size: 17px; }
.lvsub { color: var(--gold); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.sgrid div { background: var(--panel2); border: 2px solid var(--line); padding: 8px 10px; }
.sgrid b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.sgrid span { font-family: var(--f-dlg); font-size: 16px; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.week i { width: 100%; aspect-ratio: 1; max-width: 30px; background: var(--code-bg); border: 2px solid var(--line2); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.week .on i { background: #ff8a4c; border-color: #ffb48a; color: #2a1206; }
.week .today span { color: var(--gold); }
.week .today i { outline: 2px solid var(--gold); outline-offset: 1px; }
.navnote { font-family: var(--f-dlg); font-size: 16px; color: var(--muted); line-height: 1.15; margin: 0; padding: 0 4px; }
.stage { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
.view { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view[hidden] { display: none !important; }
.bar { height: 14px; background: var(--code-bg); border: 2px solid var(--line2); position: relative; margin-top: 10px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, var(--gold2) 6px 8px); transition: width .4s steps(8); }
.barlabel { font-family: var(--f-dlg); font-size: 17px; color: var(--muted); margin-top: 4px; }
.quest h4 { color: var(--gold); }
.quest p { margin: 0; font-family: var(--f-dlg); font-size: 19px; line-height: 1.1; }
.quest .qbtn { margin-top: 10px; width: 100%; }
.worlds { display: flex; flex-direction: column; gap: 4px; }
.wrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); background: none; border: 2px solid transparent; padding: 5px 6px; text-align: left; }
.wrow:hover { border-color: var(--line2); background: var(--panel2); }
.wrow.cur { border-color: var(--gold2); }
.wrow em { font-style: normal; color: var(--gold); font-size: 12px; }
.wrow b { color: var(--ink); font-weight: 400; }
.wrow .bar { grid-column: 2 / -1; height: 6px; margin: 0; border-width: 1px; }
.wrow .bar i { background: var(--indigo); }
.wrow.full .bar i { background: var(--good); }
.fab { position: fixed; z-index: 30; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 28px); display: none; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 6px 0 rgba(0,0,0,.45), inset -3px -3px 0 rgba(0,0,0,.25); }
@media (max-width: 1099px) { body[data-view="peta"] .fab { display: flex; } }
.sheet .mbox { text-align: left; max-height: 86vh; overflow-y: auto; }
.sheet .dc { box-shadow: none; margin-bottom: 10px; }
/* pixel buttons */
.px { border: 3px solid var(--line2); background: var(--panel2); padding: 9px 16px; font-size: 15px; letter-spacing: .5px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.06); }
.px:hover { border-color: var(--muted); }
.px:active { box-shadow: inset 3px 3px 0 rgba(0,0,0,.4); transform: translateY(1px); }
.px.gold { background: var(--gold); color: #2a1d02; border-color: #ffe08f; }
.px.gold:hover { border-color: #fff3c8; }
.px.indigo { background: var(--indigo2); border-color: var(--indigo); }
.px.good { background: #2f7a4b; border-color: var(--good); }
.px:disabled { opacity: .45; cursor: not-allowed; }
/* map */
.maphead { max-width: 600px; margin: 0 auto; border: 3px solid #0b0c10; outline: 3px solid var(--line2); background: var(--panel); display: grid; grid-template-columns: 66px 1fr; box-shadow: 0 8px 0 rgba(0,0,0,.35); position: sticky; top: 0; z-index: 6; }
.maphead .num { display: grid; place-items: center; font-size: 28px; color: var(--gold); border-right: 3px solid var(--line2); background: repeating-linear-gradient(180deg, #232738 0 4px, #1f2232 4px 8px); }
.maphead .txt { padding: 9px 16px 10px; min-width: 0; }
.maphead .txt b { display: block; font-size: 19px; letter-spacing: 1.5px; text-transform: uppercase; }
.maphead .txt span { font-family: var(--f-dlg); font-size: 18px; color: var(--muted); }
.mhbar { height: 8px; margin-top: 6px; background: var(--code-bg); border: 2px solid #0b0c10; position: relative; }
.mhbar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, var(--gold2) 6px 8px); transition: width .3s steps(6); }
.mapwrap { position: relative; max-width: 600px; margin: 0 auto; border-left: 4px solid #0b0c10; border-right: 4px solid #0b0c10; box-shadow: 3px 0 0 var(--line2), -3px 0 0 var(--line2); }
.mapwrap > canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.mapwrap > #mapFx { position: absolute; inset: 0; height: 100%; pointer-events: none; }
.node { position: absolute; width: 15%; max-width: 86px; aspect-ratio: 1; transform: translate(-50%, -50%); border: none; background: none; padding: 0; --hi: #9ea3b6; --mid: #6a6f84; --lo: #444859; --ink2: #d8d9e3; }
.node::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -8%; height: 16%; background: rgba(0,0,0,.38); border-radius: 50%; z-index: -1; }
.node.open { --hi: #c3c6ff; --mid: #7d82ef; --lo: #4d52b8; --ink2: #fff; }
.node.done { --hi: #fff0b8; --mid: #f2c14e; --lo: #b98a1f; --ink2: #2a1d02; }
.node.boss.open { --hi: #ffb8ad; --mid: #e0574a; --lo: #9a2f26; --ink2: #fff; }
.node.boss.done { --hi: #fff0b8; --mid: #f2c14e; --lo: #b98a1f; }
.node .stone { position: absolute; inset: 0; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); background: #0d0e14; display: grid; place-items: center; }
.node .stone::before { content: ""; position: absolute; inset: 8%; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); background: linear-gradient(180deg, var(--hi) 0 24%, var(--mid) 24% 70%, var(--lo) 70%); }
.node .stone::after { content: ""; position: absolute; left: 26%; top: 16%; width: 18%; height: 8%; background: rgba(255,255,255,.55); }
.node .stone .n { position: relative; z-index: 1; display: grid; place-items: center; width: 100%; height: 100%; font-size: clamp(14px, 3.4vw, 22px); font-weight: 700; color: var(--ink2); text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.node.done .stone .n { text-shadow: 1px 1px 0 rgba(255,255,255,.4); }
.node:hover .stone::before, .node:focus-visible .stone::before { filter: brightness(1.12); }
.node.cur::before { content: ""; position: absolute; inset: -16%; border: 3px solid var(--gold); border-radius: 50%; animation: ring 1.2s steps(6) infinite; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
.node .lbl { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 9px); white-space: nowrap; font-size: clamp(10px, 2.4vw, 13px); background: #3a2514; border: 2px solid #140b05; box-shadow: 0 2px 0 #140b05, inset 0 2px 0 #5a3a20; padding: 2px 8px; color: #f6e7c6; pointer-events: none; }
.node.locked .lbl { background: #23252f; box-shadow: 0 2px 0 #0d0e14, inset 0 2px 0 #343747; color: #a7aabb; border-color: #0d0e14; }
.node .stars { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 12px; color: var(--gold); letter-spacing: 1px; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; white-space: nowrap; }
.node .stars em { font-style: normal; color: rgba(255,255,255,.35); }
.chest { position: absolute; width: 10%; aspect-ratio: 4/3; transform: translate(-50%, -50%); background: none; border: none; padding: 0; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.chest canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.chest.ready { animation: wiggle .8s steps(4) infinite; }
.hero { position: absolute; width: 11%; aspect-ratio: 1; transform: translate(-50%, -100%); pointer-events: none; transition: left .5s steps(6), top .5s steps(6); filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
.hero canvas { width: 100%; height: 100%; image-rendering: pixelated; animation: bob 1s steps(2) infinite; }
.banner { position: absolute; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: stretch; background: repeating-linear-gradient(180deg, #7a5230 0 7px, #6b4423 7px 9px); border: 3px solid #241306; box-shadow: 0 4px 0 rgba(0,0,0,.4), inset 0 2px 0 #9a6a3e; white-space: nowrap; pointer-events: none; z-index: 2; }
.banner::before, .banner::after { content: ""; position: absolute; bottom: -14px; width: 6px; height: 12px; background: #3b2412; border: 2px solid #241306; border-top: none; }
.banner::before { left: 14px; } .banner::after { right: 14px; }
.banner i { font-style: normal; display: grid; place-items: center; min-width: 30px; background: #241306; color: var(--gold); font-size: clamp(12px, 3vw, 16px); }
.banner span { padding: 5px 14px; font-size: clamp(12px, 3vw, 16px); letter-spacing: 2px; text-transform: uppercase; color: #fff1d0; text-shadow: 2px 2px 0 #241306; }
.banner.done i { background: var(--gold); color: #241306; }
@keyframes bob { 50% { transform: translateY(-6%); } }
@keyframes pulse { 50% { filter: brightness(1.3); transform: scale(1.06); } }
@keyframes wiggle { 25% { transform: translate(-50%, -50%) rotate(-6deg); } 75% { transform: translate(-50%, -50%) rotate(6deg); } }
/* lesson */
.lesson { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.lhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lhead .crumb { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
.lhead h2 { margin: 0; font-size: 26px; font-weight: 600; flex: 1; min-width: 200px; text-wrap: balance; }
.dialog { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: end; }
.portrait { width: 96px; height: 96px; background: var(--panel2); border: 3px solid var(--line2); display: grid; place-items: center; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35); }
.portrait canvas { width: 80px; height: 80px; image-rendering: pixelated; }
.dbox { background: #0c0d13; border: 3px solid #e9e4cf; outline: 3px solid #000; box-shadow: 0 0 0 6px #000; padding: 14px 18px 12px; min-height: 96px; position: relative; font-family: var(--f-dlg); font-size: 23px; line-height: 1.2; }
.dbox .who { position: absolute; top: -14px; left: 14px; background: #e9e4cf; color: #0c0d13; font-family: var(--f-pixel); font-size: 13px; padding: 1px 8px; letter-spacing: 1px; }
.dbox .say { min-height: 2.4em; }
.dbox .say code, .task code { font-family: var(--f-code); font-size: .72em; background: #1d2030; padding: 1px 5px; color: var(--var); }
.dbox .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.dbox .prog { font-family: var(--f-pixel); font-size: 12px; color: var(--muted); letter-spacing: 1px; }
#dbtns { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.dbtn { background: none; border: none; font-family: var(--f-pixel); font-weight: 700; font-size: 16px; letter-spacing: 1px; padding: 4px 6px; color: var(--ink); }
.dbtn:hover { color: var(--gold); }
.dbtn.next::after { content: ' ▼'; display: inline-block; animation: blinkY .7s steps(2) infinite; }
@keyframes blinkY { 50% { transform: translateY(3px); } }
.dbox.mood-good { border-color: var(--good); }
.dbox.mood-good .who { background: var(--good); }
.dbox.mood-bad { border-color: var(--bad); }
.dbox.mood-bad .who { background: var(--bad); }
.work { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 3px solid var(--line2); box-shadow: inset -3px -3px 0 rgba(0,0,0,.3); min-width: 0; }
.card > h3 { margin: 0; padding: 9px 14px; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card .body { padding: 14px; min-width: 0; }
.example pre { margin: 0; overflow-x: auto; background: var(--code-bg); padding: 12px 14px; font-family: var(--f-code); font-size: 13px; line-height: 1.55; border: 2px solid #000; }
.example .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.reslabel { margin: 10px 0 4px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.example pre.result { background: #07080c; color: #e9f5e6; border-color: #2f7a4b; white-space: pre-wrap; word-break: break-word; }
.note { margin-top: 12px; padding: 10px 12px; background: var(--panel2); border-left: 4px solid var(--indigo); font-family: var(--f-dlg); font-size: 19px; line-height: 1.25; }
.note code { font-family: var(--f-code); font-size: 13px; background: #11131b; padding: 1px 5px; color: var(--var); }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.opt { text-align: left; background: var(--panel2); border: 3px solid var(--line2); padding: 10px 12px; font-family: var(--f-code); font-size: 14px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35); }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.right { border-color: var(--good); background: #1e3b2a; color: #c9f5d8; }
.opt.wrong { border-color: var(--bad); background: #3a1d22; color: #ffc1c1; text-decoration: line-through; }
.opt:disabled { cursor: default; }
.task code { font-family: var(--f-code); font-size: .72em; background: #1d2030; padding: 1px 5px; color: var(--var); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 3px solid var(--line2); background: var(--panel2); padding: 6px 12px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tab.on { background: var(--indigo2); border-color: var(--indigo); color: #fff; }
.tab.done { color: var(--gold); }
.tab.done.on { color: #fff; }
.task { font-family: var(--f-dlg); font-size: 21px; line-height: 1.22; }
.task pre { font-family: var(--f-code); font-size: 13px; background: var(--code-bg); padding: 8px 10px; margin: 8px 0 0; border: 2px solid #000; overflow-x: auto; line-height: 1.5; }
.task .tacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.hintbox { margin-top: 12px; border: 2px dashed var(--gold2); padding: 8px 10px; color: var(--gold); font-size: 19px; }
.answer pre { margin: 8px 0 0; }
.lessonlist { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
/* editor */
.editor { position: relative; background: var(--code-bg); border-bottom: 3px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); font-family: var(--f-code); font-size: 14px; --lh: 21px; line-height: var(--lh); height: 340px; overflow: hidden; }
.gutter { padding: 12px 8px 12px 10px; text-align: right; color: #4c5370; user-select: none; overflow: hidden; border-right: 2px solid #1d2030; font-variant-numeric: tabular-nums; min-width: 40px; }
.gutter div { height: var(--lh); }
.gutter .errline { color: #fff; background: var(--bad); }
.codearea { position: relative; min-width: 0; }
.codearea textarea, .codearea pre { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: inherit; line-height: inherit; white-space: pre; overflow: auto; tab-size: 4; border: none; letter-spacing: 0; word-spacing: 0; }
.codearea pre { pointer-events: none; color: var(--ink); overflow: hidden; }
.codearea textarea { background: transparent; color: transparent; caret-color: var(--gold); resize: none; outline: none; }
.codearea textarea::selection { background: rgba(125, 130, 239, .4); color: transparent; }
.tk-kw { color: var(--kw); } .tk-str { color: var(--str); } .tk-var { color: var(--var); } .tk-num { color: var(--num); } .tk-cm { color: var(--cm); font-style: italic; } .tk-fn { color: var(--fn); } .tk-tag { color: var(--bad); }
.edbar { display: flex; gap: 8px; padding: 10px; flex-wrap: wrap; align-items: center; }
.edbar .grow { flex: 1; }
.edbar small { color: var(--muted); font-size: 12px; }
.console { padding: 0; }
.console .chead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 2px solid var(--line); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.console .chead .seg { display: flex; gap: 0; }
.console .chead .seg button { background: none; border: 2px solid var(--line2); padding: 2px 8px; font-size: 11px; color: var(--muted); }
.console .chead .seg button.on { background: var(--line2); color: var(--ink); }
.out { margin: 0; padding: 12px 14px; min-height: 90px; max-height: 260px; overflow: auto; font-family: var(--f-code); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.out.empty { color: var(--muted); font-family: var(--f-dlg); font-size: 19px; }
.outhtml { padding: 12px 14px; min-height: 90px; max-height: 260px; overflow: auto; background: #fff; color: #111; font-family: system-ui, sans-serif; font-size: 14px; }
.diag { margin: 0 12px 12px; padding: 8px 10px; font-family: var(--f-code); font-size: 12.5px; line-height: 1.45; border-left: 4px solid; background: #1a1418; white-space: pre-wrap; word-break: break-word; }
.diag.fatal, .diag.parse { border-color: var(--bad); color: #ffc1c1; }
.diag.warning { border-color: var(--gold); color: #ffe6a8; background: #1b1810; }
.diag b { font-family: var(--f-pixel); letter-spacing: .5px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 12px 12px; }
.cmp div { min-width: 0; }
.cmp h5 { margin: 0 0 4px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.cmp pre { margin: 0; background: #0a0b10; border: 2px solid var(--line); padding: 8px; font-family: var(--f-code); font-size: 12.5px; overflow: auto; max-height: 160px; white-space: pre; }
.cmp .mis { background: rgba(255, 111, 111, .22); }
/* overlays */
.modal { position: fixed; inset: 0; background: rgba(4, 5, 9, .78); display: grid; place-items: center; z-index: 50; padding: 16px; }
.mbox { width: min(420px, 100%); background: var(--panel); border: 3px solid var(--gold); outline: 3px solid #000; box-shadow: 0 0 0 7px #000; padding: 24px 22px 20px; text-align: center; }
.mbox canvas { width: 128px; height: 96px; image-rendering: pixelated; }
.mbox h3 { margin: 6px 0 4px; font-size: 24px; letter-spacing: 1px; color: var(--gold); }
.mbox p { font-family: var(--f-dlg); font-size: 21px; margin: 6px 0 16px; line-height: 1.2; }
.mbox .reward { display: inline-flex; gap: 8px; align-items: center; font-size: 20px; color: var(--gold); margin-bottom: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #0c0d13; border: 3px solid var(--gold); outline: 3px solid #000; padding: 8px 16px; font-size: 16px; color: var(--gold); z-index: 60; pointer-events: none; white-space: nowrap; animation: pop .25s steps(3); }
@keyframes pop { from { transform: translate(-50%, 20px); opacity: 0; } }
.xpfloat { position: fixed; z-index: 70; color: var(--gold); font-size: 22px; font-weight: 700; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: rise 1.1s steps(10) forwards; }
@keyframes rise { to { transform: translateY(-70px); opacity: 0; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; }
/* pages */
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page h2 { margin: 0; font-size: 26px; font-weight: 600; }
.page .lead { font-family: var(--f-dlg); font-size: 21px; color: var(--muted); margin: 0; line-height: 1.2; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.badge { background: var(--panel); border: 3px solid var(--line); padding: 14px; text-align: center; }
.badge canvas { width: 64px; height: 64px; image-rendering: pixelated; }
.badge b { display: block; margin-top: 6px; font-size: 15px; }
.badge span { font-family: var(--f-dlg); font-size: 17px; color: var(--muted); line-height: 1.1; display: block; }
.badge.lock { opacity: .4; filter: grayscale(1); }
.ref { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ref button { text-align: left; background: var(--panel); border: 3px solid var(--line); padding: 10px 12px; }
.ref button:hover { border-color: var(--indigo); }
.ref b { display: block; font-size: 14px; }
.ref span { font-family: var(--f-dlg); font-size: 17px; color: var(--muted); }
/* mobile */
.tabbar { display: none; }
.moresheet { position: fixed; inset: 0; z-index: 70; }
.moresheet[hidden] { display: none; }
.ms-back { position: absolute; inset: 0; background: rgba(5, 6, 12, .6); }
.ms-panel { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 3px solid var(--line2); box-shadow: 6px 6px 0 #000; display: flex; flex-direction: column; padding: 6px; animation: msUp .16s steps(3) both; }
.ms-panel button { display: flex; align-items: center; gap: 14px; background: none; border: none; color: var(--ink); text-align: left; padding: 12px 12px; min-height: 56px; }
.ms-panel button + button { border-top: 2px solid var(--line); }
.ms-panel button.on { color: var(--gold); }
.ms-panel svg { width: 24px; height: 24px; flex: none; color: var(--gold); }
.ms-panel b { display: block; font-size: 15px; }
.ms-panel small { display: block; font-family: var(--f-dlg); font-size: 18px; color: var(--muted); }
@keyframes msUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ms-panel { animation: none; } }
@media (max-width: 1440px) { .toptabs button { padding: 10px 8px 9px; gap: 6px; font-size: 14px; } .appbar { gap: 12px; } }
@media (max-width: 1320px) { .toptabs button span { display: none; } .toptabs button { padding: 10px; } }
@media (max-width: 860px) {
  .toptabs, .hide-s { display: none; }
  .appbar { gap: 10px; justify-content: space-between; padding-block: 6px; }
  .brand canvas { width: 30px; height: 30px; } .brand b { font-size: 15px; } .brand small { font-size: 10px; }
  .lvt { min-width: 52px; } .iconbtn { width: 34px; height: 34px; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 3px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar button { background: none; border: none; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  .tabbar button.on { color: var(--gold); }
  .tabbar svg { width: 20px; height: 20px; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .dialog { grid-template-columns: 64px minmax(0, 1fr); }
  .portrait { width: 64px; height: 64px; } .portrait canvas { width: 54px; height: 54px; }
  .dbox { font-size: 20px; }
  .tabbar { grid-template-columns: repeat(5, 1fr); }
  .editor { height: 260px; font-size: 16px; --lh: 23px; }
  .gutter { min-width: 30px; padding-left: 6px; padding-right: 6px; }
  .lesson { gap: 12px; }
  .lhead { gap: 8px; }
  .lhead > div { order: 1; flex-basis: calc(100% - 100px); min-width: 0; }
  .lhead #backMap { order: 0; padding: 6px 10px; }
  .lhead h2 { font-size: 20px; }
  .lhead .tabs { order: 2; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .lhead .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 6px 10px; font-size: 13px; }
  .dialog { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
  .portrait { width: 52px; height: 52px; } .portrait canvas { width: 44px; height: 44px; }
  .dbox { font-size: 19px; padding: 12px 12px 8px; min-height: 0; }
  .dbox .say { min-height: 0; }
  .card .body { padding: 12px; }
  .task { font-size: 20px; }
  .edbar { position: sticky; bottom: 0; background: var(--panel); z-index: 4; border-top: 3px solid var(--line); padding: 8px; }
  .edbar small { display: none; }
  .edbar .px { padding: 10px 12px; }
  .edbar .grow { display: none; }
  #btnReset { margin-left: auto; }
  .edbar { flex-wrap: nowrap; }
  .edbar .px.indigo, #btnCheck { flex: 1; white-space: nowrap; }
  .rl { display: none; }
  .opt { padding: 12px; font-size: 15px; }
  .view { padding-block: 14px 40px; }
  .page h2 { font-size: 22px; }
}

.symbar button { flex: none; min-width: 40px; height: 40px; padding: 0 10px; background: var(--panel2); border: 2px solid var(--line2); font-family: var(--f-code); font-size: 16px; color: var(--var); box-shadow: inset -2px -2px 0 rgba(0,0,0,.4); touch-action: manipulation; }
.symbar button.k { color: var(--muted); font-family: var(--f-pixel); font-size: 13px; }

.kbubble { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 45; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; background: #0c0d13; border: 3px solid #e9e4cf; outline: 3px solid #000; padding: 8px 10px; font-family: var(--f-dlg); font-size: 19px; line-height: 1.15; animation: pop .2s steps(3); }

@media (min-width: 861px) { .kbubble { display: none; } }
.combo { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 72; pointer-events: none; font-size: clamp(30px, 8vw, 54px); font-weight: 700; color: var(--gold); text-shadow: 3px 3px 0 #000, -2px -2px 0 #000; letter-spacing: 2px; animation: comboPop 1.2s steps(8) forwards; white-space: nowrap; }

@keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(.4); } 20% { transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1); opacity: 0; } }
.combochip { font-size: 12px; letter-spacing: 1px; color: #2a1d02; background: var(--gold); padding: 2px 8px; border: 2px solid #000; }
/* kuis kilat */

const OPS = ['<=>', '**=', '...', '===', '!==', '<<=', '>>=', '??=', '?->', '==', '!=', '<>', '<=', '>=', '&&', '||', '++', '--', '+=', '-=', '*=', '/=', '.=', '%=', '**', '->', '=>', '::', '??', '<<', '>>', '|=', '&=', '^=',

  '?': [5, 'L'], '??': [6, 'R'], '||': [7, 'L'], '&&': [8, 'L'], '|': [9, 'L'], '^': [10, 'L'], '&': [11, 'L'],

function describeTok(t) {
  if (t.t === 'eof') return 'akhir kode (end of file)';

  if (t.t === 'num') return 'angka "' + (t.v instanceof PFloat ? t.v.v : t.v) + '"';
  if (t.t === 'str' || t.t === 'tpl') return 'string';
  if (t.t === 'id') return 'kata "' + t.v + '"';
  if (t.t === 'html') return 'teks di luar tag PHP';

<script>// shared grading logic
function applyVary(code, v) {
  for (const k in v) {
    const re = new RegExp('\\$' + k + '\\s*=\\s*[\\s\\S]*?;');
    code = code.replace(re, () => '$' + k + ' = ' + v[k] + ';');
  }
  return code;
}
function normOut(s) { return s.replace(/\r/g, '').split('\n').map(l => l.replace(/[ \t]+$/, '')).join('\n').replace(/\n+$/, ''); }
function stripComments(code) { return code.replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:"'])\/\/[^\n]*/g, '$1').replace(/#[^\n\[]*/g, ''); }
function grade(run, ex, code) {
  const r = run(code);
  const res = { run: r, ok: false, reason: null, detail: null };
  const bad = r.diags.find(d => d.kind === 'parse' || d.kind === 'fatal');
  if (bad) { res.reason = bad.kind; res.detail = bad; return res; }
  const exp = normOut(run(ex.a).output);
  const got = normOut(r.output);
  if (got !== exp) { res.reason = 'output'; res.expected = exp; res.got = got; return res; }
  for (const [re, msg] of ex.needRaw || []) {
    if (!new RegExp(re, 'i').test(code)) { res.reason = 'need'; res.detail = msg; return res; }
  }
  const clean = stripComments(code);
  for (const [re, msg] of ex.need || []) {
    if (!new RegExp(re, 'i').test(clean)) { res.reason = 'need'; res.detail = msg; return res; }
  }
  for (const v of ex.vary || []) {
    const ue = applyVary(code, v), se = applyVary(ex.a, v);
    const ur = run(ue), sr = run(se);
    const ubad = ur.diags.find(d => d.kind === 'parse' || d.kind === 'fatal');
    if (ubad || normOut(ur.output) !== normOut(sr.output)) {
      res.reason = 'vary'; res.vary = v; res.expected = normOut(sr.output); res.got = ubad ? '(error: ' + ubad.msg + ')' : normOut(ur.output); return res;
    }
  }
  if (r.diags.length) res.warnings = r.diags;
  res.ok = true; return res;
}
if (typeof module !== 'undefined') module.exports = { grade, applyVary, normOut };
</script>

if ($umur >= 17 && $punyaKTP) {
    echo "Boleh ikut pemilu";
}` },
  { say: 'Kalau membandingkan satu variabel dengan banyak nilai pasti, switch lebih rapi. Jangan lupa break di setiap case!', code: c`<?php
$menu = 2;
switch ($menu) {
    case 1:
        echo "Nasi goreng";
        break;
    case 2:
        echo "Mie ayam";
        break;
    default:
        echo "Menu tidak ada";
}` },
  { say: 'PHP 8 punya match: lebih ringkas, langsung menghasilkan nilai, dan tidak butuh break.', code: c`<?php
$kode = "JKT";
$kota = match ($kode) {
    "JKT" => "Jakarta",
    "BDG" => "Bandung",
    default => "Tidak dikenal",
};
echo $kota;` },
  { say: 'Ada juga operator ternary: kondisi ? nilaiJikaBenar : nilaiJikaSalah. Cocok untuk pilihan singkat.', code: c`<?php
$stok = 0;
echo $stok > 0 ? "Tersedia" : "Habis";` }
], ex: [
  { t: 'Tampilkan <code>Boleh menyetir</code> jika <code>$umur</code> minimal 17 <b>dan</b> <code>$punyaSIM</code> true. Selain itu <code>Belum boleh</code>.', s: c`<?php
$umur = 20;
$punyaSIM = true;
`, a: c`<?php
$umur = 20;
$punyaSIM = true;
if ($umur >= 17 && $punyaSIM) {
    echo "Boleh menyetir";
} else {
    echo "Belum boleh";
}`, h: 'if ($umur >= 17 && $punyaSIM) { ... }', need: [['&&|\\band\\b', 'Gabungkan dua kondisi dengan &&.']], vary: [{ umur: '15' }, { punyaSIM: 'false' }, { umur: '17' }] },
  { t: 'Pakai <b>switch</b>: ubah <code>$hari</code> (1-7) jadi nama hari: 1 Senin, 2 Selasa, 3 Rabu, 4 Kamis, 5 Jumat, 6 Sabtu, 7 Minggu. Selain itu <code>Tidak valid</code>.', s: c`<?php
$hari = 3;
`, a: c`<?php
$hari = 3;
switch ($hari) {
    case 1: echo "Senin"; break;
    case 2: echo "Selasa"; break;
    case 3: echo "Rabu"; break;
    case 4: echo "Kamis"; break;
    case 5: echo "Jumat"; break;
    case 6: echo "Sabtu"; break;
    case 7: echo "Minggu"; break;
    default: echo "Tidak valid";
}`, h: 'switch ($hari) { case 1: echo "Senin"; break; ... default: ... }', need: [['switch', 'Gunakan switch.'], ['default', 'Tambahkan default untuk nilai yang tidak valid.']], vary: [{ hari: '7' }, { hari: '1' }, { hari: '9' }] },
  { t: 'Pakai <b>match</b>: <code>$kode</code> "ID" → <code>Indonesia</code>, "MY" → <code>Malaysia</code>, "SG" → <code>Singapura</code>, lainnya <code>Tidak dikenal</code>.', s: c`<?php
$kode = "ID";
`, a: c`<?php
$kode = "ID";
echo match ($kode) {
    "ID" => "Indonesia",
    "MY" => "Malaysia",
    "SG" => "Singapura",
    default => "Tidak dikenal",
};`, h: 'echo match ($kode) { "ID" => "Indonesia", ..., default => "Tidak dikenal" };', need: [['match\\s*\\(', 'Gunakan match.']], vary: [{ kode: '"SG"' }, { kode: '"JP"' }] }
]}
]},
{ id: 'gua', name: 'Gua Perulangan', biome: 'gua', blurb: 'Mengulang perintah dengan for, while, dan loop bersarang.', lessons: [
{ id: 'for', title: 'Perulangan For', steps: [
  { say: 'Bayangkan disuruh menulis angka 1 sampai 100. Capek kan? Perulangan (loop) mengerjakannya untukmu.' },
  { say: 'for punya 3 bagian: mulai dari mana; sampai kapan; lalu langkahnya. $i++ artinya tambah 1.', code: c`<?php
for ($i = 1; $i <= 5; $i++) {
    echo "Putaran ke-$i\n";
}` },
  { say: 'Langkahnya bisa diubah. Misalnya $i += 2 untuk lompat dua-dua, atau $i-- untuk mundur.', code: c`<?php
for ($i = 10; $i >= 0; $i -= 2) {
    echo $i . " ";
}` },
  { say: 'Pola penting: variabel "penampung" di luar loop untuk menjumlah.', code: c`<?php
$total = 0;
for ($i = 1; $i <= 10; $i++) {
    $total += $i;
}
echo "Jumlah 1-10: $total";` }
], ex: [
  { t: 'Tampilkan angka <b>1 sampai 10</b>, masing-masing di baris sendiri, memakai <b>for</b>.', s: c`<?php
`, a: c`<?php
for ($i = 1; $i <= 10; $i++) {
    echo "$i\n";
}`, h: 'for ($i = 1; $i <= 10; $i++) { echo "$i\n"; }', need: [['for\\s*\\(', 'Gunakan perulangan for.']] },
  { t: 'Tampilkan kelipatan 3 dari <b>3 sampai 30</b> dalam satu baris, dipisah spasi: <code>3 6 9 ... 30</code>', s: c`<?php
`, a: c`<?php
for ($i = 3; $i <= 30; $i += 3) {
    echo $i . " ";
}`, h: 'Mulai $i = 3, lalu tambah 3 setiap putaran: $i += 3', need: [['for\\s*\\(', 'Gunakan perulangan for.']] },
  { t: 'Hitung jumlah semua angka dari 1 sampai <code>$n</code> pakai for. Untuk $n = 100 tampil <code>Total: 5050</code>', s: c`<?php
$n = 100;
$total = 0;
`, a: c`<?php
$n = 100;
$total = 0;
for ($i = 1; $i <= $n; $i++) {
    $total += $i;
}
echo "Total: $total";`, h: 'Di dalam loop: $total += $i; — lalu echo setelah loop selesai.', need: [['for\\s*\\(', 'Gunakan perulangan for.']], vary: [{ n: '10' }, { n: '7' }] }
]},
{ id: 'while', title: 'While & Do-While', steps: [
  { say: 'while mengulang selama kondisinya masih benar. Cocok kalau kamu belum tahu harus berapa kali mengulang.', code: c`<?php
$energi = 3;
while ($energi > 0) {
    echo "Lari! Energi: $energi\n";
    $energi--;
}
echo "Capek, istirahat dulu.";` },
  { say: 'HATI-HATI: kalau nilai di dalam loop tidak pernah berubah, loop tidak akan berhenti (infinite loop). Di sini programnya akan aku hentikan otomatis.' },
  { say: 'do-while mirip while, tapi isinya dijalankan minimal sekali, karena kondisinya dicek di akhir.', code: c`<?php
$x = 10;
do {
    echo "Dijalankan sekali walau x = $x";
} while ($x < 5);` },
  { say: 'Contoh nyata: menabung sampai target tercapai.', code: c`<?php
$tabungan = 0;
$bulan = 0;
while ($tabungan < 500000) {
    $tabungan += 120000;
    $bulan++;
}
echo "Target tercapai dalam $bulan bulan";` }
], ex: [
  { t: 'Pakai <b>while</b> untuk hitung mundur dari <code>$hitung</code> ke 1 (satu angka per baris), lalu tampilkan <code>Meluncur!</code>', s: c`<?php
$hitung = 5;
`, a: c`<?php
$hitung = 5;
while ($hitung >= 1) {
    echo "$hitung\n";
    $hitung--;
}
echo "Meluncur!";`, h: 'while ($hitung >= 1) { echo "$hitung\n"; $hitung--; }', need: [['while\\s*\\(', 'Gunakan while.']], vary: [{ hitung: '3' }] },
  { t: 'Saldo awal 0. Tiap bulan menabung <code>$setoran</code>. Pakai while untuk cari berapa bulan sampai saldo minimal 1.000.000. Tampilkan <code>Butuh 7 bulan</code>.', s: c`<?php
$setoran = 150000;
$saldo = 0;
$bulan = 0;
`, a: c`<?php
$setoran = 150000;
$saldo = 0;
$bulan = 0;
while ($saldo < 1000000) {
    $saldo += $setoran;
    $bulan++;
}
echo "Butuh $bulan bulan";`, h: 'Selama $saldo < 1000000: tambah setoran ke saldo dan tambah $bulan 1.', need: [['while\\s*\\(', 'Gunakan while.']], vary: [{ setoran: '250000' }, { setoran: '100000' }] },
  { t: 'Hitung jumlah digit <code>$angka</code> pakai while (bagi 10 terus pakai intdiv sampai 0). Untuk 98765 tampil <code>Jumlah digit: 5</code>', s: c`<?php
$angka = 98765;
$digit = 0;
`, a: c`<?php
$angka = 98765;
$digit = 0;
do {
    $angka = intdiv($angka, 10);
    $digit++;
} while ($angka > 0);
echo "Jumlah digit: $digit";`, h: 'Setiap putaran: $angka = intdiv($angka, 10); $digit++; sampai $angka jadi 0.', need: [['while', 'Gunakan while atau do-while.']], vary: [{ angka: '7' }, { angka: '1000' }] }
]},
{ id: 'nested', title: 'Loop Bersarang', steps: [
  { say: 'Loop bisa ada di dalam loop. Loop dalam selesai dulu semua, baru loop luar maju satu langkah.', code: c`<?php
for ($baris = 1; $baris <= 3; $baris++) {
    for ($kolom = 1; $kolom <= 4; $kolom++) {
        echo "# ";
    }
    echo "\n";
}` },
  { say: 'break menghentikan loop saat itu juga. continue melewati sisa putaran ini dan lanjut ke putaran berikutnya.', code: c`<?php
for ($i = 1; $i <= 10; $i++) {
    if ($i == 3) continue; // lewati 3
    if ($i == 7) break;    // berhenti di 7
    echo $i . " ";
}` },
  { say: 'Pola segitiga sering ditanya di ujian! Loop dalam berjalan sampai nilai loop luar.', code: c`<?php
for ($i = 1; $i <= 4; $i++) {
    echo str_repeat("*", $i) . "\n";
}` }
], ex: [
  { t: 'Buat segitiga bintang setinggi <code>$tinggi</code> memakai <b>dua for bersarang</b> (tanpa str_repeat):<pre>*\n**\n***\n****\n*****</pre>', s: c`<?php
$tinggi = 5;
`, a: c`<?php
$tinggi = 5;
for ($i = 1; $i <= $tinggi; $i++) {
    for ($j = 1; $j <= $i; $j++) {
        echo "*";
    }
    echo "\n";
}`, h: 'Loop luar $i 1..$tinggi; loop dalam $j 1..$i mencetak "*"; setelah loop dalam echo "\n".', need: [['for[\\s\\S]*for', 'Gunakan dua for bersarang.'], ['^(?![\\s\\S]*str_repeat)', 'Coba tanpa str_repeat ya, pakai loop dalam.']], vary: [{ tinggi: '3' }] },
  { t: 'Buat tabel perkalian <code>$n</code> dari 1 sampai 10. Contoh baris: <code>3 x 1 = 3</code>', s: c`<?php
$n = 3;
`, a: c`<?php
$n = 3;
for ($i = 1; $i <= 10; $i++) {
    echo "$n x $i = " . ($n * $i) . "\n";
}`, h: 'echo "$n x $i = " . ($n * $i) . "\n";', need: [['for\\s*\\(', 'Gunakan for.']], vary: [{ n: '7' }] },
  { t: 'Tampilkan 1 sampai 20 dipisah spasi, tapi <b>lewati kelipatan 4</b> dengan <code>continue</code>.', s: c`<?php
`, a: c`<?php
for ($i = 1; $i <= 20; $i++) {
    if ($i % 4 == 0) {
        continue;
    }
    echo $i . " ";
}`, h: 'if ($i % 4 == 0) continue;', need: [['continue', 'Gunakan continue.']] }
]}
]},
{ id: 'pasar', name: 'Pasar Array', biome: 'pasar', blurb: 'Menyimpan banyak data sekaligus dengan array.', lessons: [
{ id: 'array', title: 'Array Dasar', steps: [
  { say: 'Array = satu variabel yang menyimpan banyak nilai. Tulis dengan kurung siku [ ].', code: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
echo $buah[0];` },
  { say: 'PENTING: indeks array mulai dari 0, bukan 1! Jadi elemen kedua adalah $buah[1].' },
  { say: 'Tambah elemen di akhir dengan $array[] = nilai. count() menghitung jumlah elemen.', code: c`<?php
$buah = ["Apel", "Jeruk"];
$buah[] = "Durian";
echo count($buah);` },
  { say: 'echo tidak bisa menampilkan array langsung. Pakai print_r() untuk melihat isinya.', code: c`<?php
$nilai = [80, 95, 70];
print_r($nilai);` },
  { say: 'Untuk memproses tiap elemen, pakai foreach. Ini pasangan terbaik array!', code: c`<?php
$teman = ["Andi", "Bela", "Caca"];
foreach ($teman as $nama) {
    echo "Halo, $nama!\n";
}` }
], ex: [
  { t: 'Tampilkan elemen <b>kedua</b> dari array <code>$buah</code> (hasilnya <code>Jeruk</code>).', s: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
`, a: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
echo $buah[1];`, h: 'Indeks mulai dari 0, jadi elemen kedua = $buah[1].', need: [['\\$buah\\s*\\[\\s*1\\s*\\]', 'Ambil elemennya dari array, misalnya $buah[...].']] },
  { t: 'Tambahkan <code>"Pisang"</code> ke <code>$buah</code> dengan <code>[]</code>, lalu tampilkan <code>Jumlah buah: 4</code> pakai count.', s: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
`, a: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
$buah[] = "Pisang";
echo "Jumlah buah: " . count($buah);`, h: '$buah[] = "Pisang"; lalu echo "Jumlah buah: " . count($buah);', need: [['\\$buah\\s*\\[\\s*\\]\\s*=', 'Tambahkan pakai $buah[] = ...'], ['count\\s*\\(', 'Gunakan count().']] },
  { t: 'Pakai foreach untuk menampilkan daftar bernomor:<pre>1. Apel\n2. Jeruk\n3. Mangga</pre>', s: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
`, a: c`<?php
$buah = ["Apel", "Jeruk", "Mangga"];
$no = 1;
foreach ($buah as $b) {
    echo "$no. $b\n";
    $no++;
}`, h: 'Pakai variabel $no = 1 di luar foreach, lalu $no++ di dalamnya. Atau foreach ($buah as $i => $b) dan tampilkan $i + 1.', need: [['foreach', 'Gunakan foreach.']] }
]},
{ id: 'assoc', title: 'Array Asosiatif', steps: [
  { say: 'Array asosiatif memakai kunci (key) berupa teks, bukan nomor. Formatnya "kunci" => nilai.', code: c`<?php
$mhs = [
    "nama" => "Rina",
    "npm" => "12345678",
    "ipk" => 3.6,
];
echo $mhs["nama"];` },
  { say: 'foreach bisa mengambil kunci dan nilainya sekaligus: foreach ($array as $kunci => $nilai).', code: c`<?php
$stok = ["pensil" => 12, "buku" => 5];
foreach ($stok as $barang => $jumlah) {
    echo "$barang: $jumlah\n";
}` },
  { say: 'Mengubah atau menambah data juga lewat kuncinya.', code: c`<?php
$stok = ["pensil" => 12];
$stok["pensil"] = 10;   // ubah
$stok["penghapus"] = 4; // tambah
print_r($stok);` },
  { say: 'Cek apakah kunci ada dengan isset() atau array_key_exists(). Ini mencegah warning "Undefined array key".' }
], ex: [
  { t: 'Dari <code>$mhs</code>, tampilkan <code>Rina - Sistem Informasi</code> (ambil dari key nama dan jurusan).', s: c`<?php
$mhs = [
    "nama" => "Rina",
    "npm" => "12345678",
    "jurusan" => "Sistem Informasi",
];
`, a: c`<?php
$mhs = [
    "nama" => "Rina",
    "npm" => "12345678",
    "jurusan" => "Sistem Informasi",
];
echo $mhs["nama"] . " - " . $mhs["jurusan"];`, h: 'echo $mhs["nama"] . " - " . $mhs["jurusan"];', need: [['\\$mhs\\s*\\[\\s*["\']nama', 'Ambil dari $mhs["nama"].'], ['\\$mhs\\s*\\[\\s*["\']jurusan', 'Ambil dari $mhs["jurusan"].']] },
  { t: 'Pakai foreach dengan key dan value untuk menampilkan tiap data <code>$mhs</code> seperti <code>nama: Rina</code> (satu per baris).', s: c`<?php
$mhs = ["nama" => "Rina", "npm" => "12345678", "jurusan" => "Sistem Informasi"];
`, a: c`<?php
$mhs = ["nama" => "Rina", "npm" => "12345678", "jurusan" => "Sistem Informasi"];
foreach ($mhs as $key => $value) {
    echo "$key: $value\n";
}`, h: 'foreach ($mhs as $key => $value) { echo "$key: $value\n"; }', need: [['foreach[^)]*=>', 'Gunakan foreach ($mhs as $key => $value).']] },
  { t: 'Hitung total belanja dari <code>$belanja</code> (nama barang => harga) pakai foreach. Tampilkan <code>Total: 23000</code>', s: c`<?php
$belanja = ["Buku" => 15000, "Pulpen" => 3000, "Penggaris" => 5000];
$total = 0;
`, a: c`<?php
$belanja = ["Buku" => 15000, "Pulpen" => 3000, "Penggaris" => 5000];
$total = 0;
foreach ($belanja as $barang => $harga) {
    $total += $harga;
}
echo "Total: $total";`, h: 'Di dalam foreach: $total += $harga;', need: [['foreach', 'Gunakan foreach.']], vary: [{ belanja: '["Tas" => 120000, "Topi" => 45000]' }] }
]},
{ id: 'multi', title: 'Array Multidimensi', steps: [
  { say: 'Array bisa berisi array lain. Ini cara menyimpan data seperti tabel: tiap baris adalah satu array.', code: c`<?php
$kelas = [
    ["nama" => "Andi", "nilai" => 80],
    ["nama" => "Bela", "nilai" => 92],
];
echo $kelas[1]["nama"];` },
  { say: 'Untuk menelusurinya, foreach biasanya mengambil satu baris, lalu kamu akses kolomnya dengan kunci.', code: c`<?php
$kelas = [
    ["nama" => "Andi", "nilai" => 80],
    ["nama" => "Bela", "nilai" => 92],
];
foreach ($kelas as $siswa) {
    echo $siswa["nama"] . " dapat " . $siswa["nilai"] . "\n";
}` },
  { say: 'Ini bentuk data yang paling sering kamu temui nanti saat mengambil data dari database!' }
], ex: [
  { t: 'Tampilkan tiap baris <code>$data</code> dengan format <code>Andi: 80</code> (satu per baris).', s: c`<?php
$data = [
    ["Andi", 80],
    ["Budi", 90],
    ["Citra", 85],
];
`, a: c`<?php
$data = [
    ["Andi", 80],
    ["Budi", 90],
    ["Citra", 85],
];
foreach ($data as $baris) {
    echo $baris[0] . ": " . $baris[1] . "\n";
}`, h: 'Tiap $baris adalah array: nama di $baris[0], nilai di $baris[1].', need: [['foreach', 'Gunakan foreach.']] },
  { t: 'Hitung rata-rata nilai semua mahasiswa di <code>$kelas</code>. Tampilkan <code>Rata-rata: 85</code>', s: c`<?php
$kelas = [
    ["nama" => "Andi", "nilai" => 80],
    ["nama" => "Bela", "nilai" => 90],
    ["nama" => "Caca", "nilai" => 85],
];
`, a: c`<?php
$kelas = [
    ["nama" => "Andi", "nilai" => 80],
    ["nama" => "Bela", "nilai" => 90],
    ["nama" => "Caca", "nilai" => 85],
];
$total = 0;
foreach ($kelas as $mhs) {
    $total += $mhs["nilai"];
}
echo "Rata-rata: " . ($total / count($kelas));`, h: 'Jumlahkan $mhs["nilai"] di foreach, lalu bagi dengan count($kelas).', need: [['foreach|array_column|array_sum', 'Hitung dari datanya, jangan ditulis langsung.']], vary: [{ kelas: '[["nama" => "X", "nilai" => 70], ["nama" => "Y", "nilai" => 90]]' }] },
  { t: 'Tampilkan hanya nama mahasiswa yang nilainya <b>di atas 80</b>, satu per baris.', s: c`<?php
$kelas = [
    ["nama" => "Andi", "nilai" => 78],
    ["nama" => "Bela", "nilai" => 91],
    ["nama" => "Caca", "nilai" => 85],
    ["nama" => "Dodi", "nilai" => 60],
];
`, a: c`<?php
$kelas = [
    ["nama" => "Andi", "nilai" => 78],
    ["nama" => "Bela", "nilai" => 91],
    ["nama" => "Caca", "nilai" => 85],
    ["nama" => "Dodi", "nilai" => 60],
];
foreach ($kelas as $mhs) {
    if ($mhs["nilai"] > 80) {
        echo $mhs["nama"] . "\n";
    }
}`, h: 'Gabungkan foreach dengan if ($mhs["nilai"] > 80).', need: [['if|array_filter', 'Pakai if untuk menyaring.']], vary: [{ kelas: '[["nama" => "Eko", "nilai" => 81], ["nama" => "Fani", "nilai" => 80]]' }] }
]}
]},
{ id: 'menara', name: 'Menara Fungsi', biome: 'menara', blurb: 'Fungsi bawaan PHP dan membuat fungsi sendiri.', lessons: [
{ id: 'bawaan', title: 'Fungsi Bawaan', steps: [
  { say: 'PHP punya ribuan fungsi siap pakai. Kamu sudah kenal strlen dan count. Sekarang kenalan dengan yang lain.' },
  { say: 'explode() memecah string jadi array. implode() menggabung array jadi string.', code: c`<?php
$csv = "nasi,ayam,sambal";
$isi = explode(",", $csv);
print_r($isi);
echo implode(" + ", $isi);` },
  { say: 'sort() mengurutkan kecil ke besar, rsort() sebaliknya. array_sum(), max(), min() langsung menghitung.', code: c`<?php
$angka = [7, 2, 9, 4];
sort($angka);
echo implode(", ", $angka), "\n";
echo "Jumlah: " . array_sum($angka) . "\n";
echo "Terbesar: " . max($angka);` },
  { say: 'str_replace() mengganti kata, in_array() mengecek isi array, ucwords() mengkapitalkan tiap kata.', code: c`<?php
echo str_replace("kopi", "teh", "saya suka kopi"), "\n";
var_dump(in_array("teh", ["kopi", "teh"]));
echo ucwords("belajar php itu seru");` }
], ex: [
  { t: 'Ubah <code>$kalimat</code> supaya setiap kata diawali huruf besar: <code>Saya Suka Belajar Php</code>', s: c`<?php
$kalimat = "saya suka belajar php";
`, a: c`<?php
$kalimat = "saya suka belajar php";
echo ucwords($kalimat);`, h: 'Ada fungsi bawaan yang namanya mirip "uppercase words".', need: [['ucwords', 'Gunakan ucwords().']], vary: [{ kalimat: '"halo dunia"' }] },
  { t: 'Urutkan <code>$angka</code> dari kecil ke besar, lalu tampilkan dengan pemisah koma-spasi: <code>1, 3, 5, 9</code>', s: c`<?php
$angka = [5, 3, 9, 1];
`, a: c`<?php
$angka = [5, 3, 9, 1];

  { t: 'Pecah <code>$warna</code> dengan explode, lalu tampilkan <code>Ada 3 warna, yang kedua: kuning</code>', s: c`<?php

`, a: c`<?php

]},
{ id: 'fungsi', title: 'Membuat Fungsi', steps: [
  { say: 'Fungsi = kumpulan kode yang diberi nama, bisa dipanggil berulang kali. Ditulis dengan kata kunci function.', code: c`<?php
function salam() {
    echo "Selamat datang!\n";
}
salam();
salam();` },
  { say: 'Fungsi bisa menerima input lewat parameter.', code: c`<?php
function sapa($nama) {
    echo "Halo, $nama!\n";
}
sapa("Dewi");
sapa("Eko");` },
  { say: 'return mengembalikan hasil supaya bisa disimpan atau diolah lagi. Bedanya dengan echo: echo menampilkan, return mengembalikan nilai.', code: c`<?php
function kuadrat($x) {
    return $x * $x;
}
$hasil = kuadrat(6);
echo $hasil + 1;` },
  { say: 'Fungsi juga bisa mengembalikan true/false. Biasanya diberi nama awalan is atau cek.', code: c`<?php
function isDewasa($umur) {
    return $umur >= 17;
}
echo isDewasa(20) ? "Dewasa" : "Belum";` }
], ex: [
  { t: 'Buat fungsi <code>sapa($nama)</code> yang <b>mengembalikan</b> (return) <code>"Halo, $nama!"</code>. Lalu tampilkan <code>sapa("Dewi")</code>.', s: c`<?php
// buat fungsi sapa di sini

echo sapa("Dewi");`, a: c`<?php
function sapa($nama) {
    return "Halo, $nama!";
}

echo sapa("Dewi");`, h: 'function sapa($nama) { return "Halo, $nama!"; }', need: [['function\\s+sapa', 'Buat fungsi bernama sapa.'], ['return', 'Gunakan return, bukan echo, di dalam fungsi.']] },
  { t: 'Buat fungsi <code>luasLingkaran($r)</code> yang mengembalikan <code>3.14 * r * r</code> dibulatkan 2 desimal (round). <code>echo luasLingkaran(7);</code> harus tampil <code>153.86</code>', s: c`<?php

echo luasLingkaran(7);`, a: c`<?php
function luasLingkaran($r) {
    return round(3.14 * $r * $r, 2);
}
echo luasLingkaran(7);`, h: 'return round(3.14 * $r * $r, 2);', need: [['function\\s+luasLingkaran', 'Buat fungsi bernama luasLingkaran.'], ['return', 'Gunakan return.']] },
  { t: 'Buat fungsi <code>isPrima($n)</code> yang mengembalikan true jika bilangan prima. Lalu tampilkan semua bilangan prima 1–20 dipisah spasi.', s: c`<?php
function isPrima($n) {
    // tulis di sini
}

for ($i = 1; $i <= 20; $i++) {
    if (isPrima($i)) {
        echo $i . " ";
    }
}`, a: c`<?php
function isPrima($n) {
    if ($n < 2) {
        return false;
    }
    for ($d = 2; $d * $d <= $n; $d++) {
        if ($n % $d == 0) {
            return false;
        }
    }

for ($i = 1; $i <= 20; $i++) {
    if (isPrima($i)) {
        echo $i . " ";
    }

]},
{ id: 'lanjut', title: 'Default, Rekursi & Arrow', steps: [
  { say: 'Parameter bisa diberi nilai default. Kalau tidak diisi saat dipanggil, nilai default yang dipakai.', code: c`<?php
function pesan($menu, $level = "sedang") {
    return "$menu pedas $level";
}
echo pesan("Seblak"), "\n";
echo pesan("Seblak", "gila");` },
  { say: 'Rekursi = fungsi yang memanggil dirinya sendiri. Wajib ada kondisi berhenti (base case), kalau tidak dia jalan selamanya.', code: c`<?php
function hitungMundur($n) {
    if ($n == 0) {
        echo "Selesai!";
        return;
    }
    echo "$n ";
    hitungMundur($n - 1);
}
hitungMundur(5);` },
  { say: 'Arrow function fn($x) => ... adalah fungsi mini satu baris. Sering dipakai bersama array_map (ubah tiap elemen) dan array_filter (saring elemen).', code: c`<?php
$harga = [10000, 25000, 40000];
$diskon = array_map(fn($h) => $h * 0.9, $harga);
print_r($diskon);

print_r($mahal);` }
], ex: [
  { t: 'Buat fungsi <code>diskon($harga, $persen = 10)</code> yang mengembalikan harga setelah diskon. Tampilkan <code>diskon(50000)</code> lalu <code>diskon(50000, 25)</code> di baris berbeda:<pre>45000\n37500</pre>', s: c`<?php

echo diskon(50000), "\n";
echo diskon(50000, 25);`, a: c`<?php
function diskon($harga, $persen = 10) {
    return $harga - ($harga * $persen / 100);
}
echo diskon(50000), "\n";
echo diskon(50000, 25);`, h: 'return $harga - ($harga * $persen / 100);', need: [['\\$persen\\s*=\\s*10', 'Beri nilai default: $persen = 10.']] },
  { t: 'Buat fungsi <b>rekursif</b> <code>faktorial($n)</code>. Faktorial 6 = 6×5×4×3×2×1. <code>echo faktorial(6);</code> → <code>720</code>', s: c`<?php

echo faktorial(6);`, a: c`<?php
function faktorial($n) {
    if ($n <= 1) {
        return 1;
    }
    return $n * faktorial($n - 1);
}
echo faktorial(6);`, h: 'Base case: jika $n <= 1 return 1. Selain itu return $n * faktorial($n - 1);', need: [['function\\s+faktorial[\\s\\S]*faktorial\\s*\\([\\s\\S]*faktorial\\s*\\(', 'faktorial() harus memanggil dirinya sendiri (rekursif).']] },
  { t: 'Pakai <code>array_filter</code> dengan arrow function untuk mengambil bilangan genap dari <code>$angka</code>, lalu tampilkan dipisah spasi: <code>2 4 6 8 10</code>', s: c`<?php

`, a: c`<?php

echo implode(" ", $genap);`, h: '$genap = array_filter($angka, fn($x) => $x % 2 == 0);', need: [['array_filter', 'Gunakan array_filter().'], ['fn\\s*\\(|function\\s*\\(', 'Gunakan arrow function fn($x) => ...']] }
]}
]},
{ id: 'kastil', name: 'Kastil OOP', biome: 'kastil', blurb: 'Class, object, enkapsulasi, pewarisan, dan exception.', lessons: [
{ id: 'class', title: 'Class & Object', steps: [
  { say: 'Selamat datang di kastil! OOP (Object Oriented Programming) adalah cara menyusun kode berdasarkan "benda".' },
  { say: 'Class itu cetakan, object itu hasil cetakannya. Class Mobil adalah desainnya; mobil Toyota merahmu adalah object-nya.', code: c`<?php

    public $merk;

    }

$mobilku = new Mobil();

  { say: 'Di dalam method, $this artinya "object ini". Dipakai untuk mengakses property milik object itu sendiri.' },
  { say: '__construct() adalah method spesial yang otomatis jalan saat object dibuat dengan new. Cocok untuk mengisi data awal.', code: c`<?php
class Kucing {
    public $nama;

    public function __construct($nama) {
        $this->nama = $nama;
    }

    public function meong() {

echo $k->meong();` }
], ex: [
  { t: 'Lengkapi method <code>info()</code> agar mengembalikan <code>Mobil Toyota warna Merah</code> memakai <code>$this</code>.', s: c`<?php
class Mobil {
    public $merk;
    public $warna;

        // return di sini
    }
}

$m = new Mobil();
$m->merk = "Toyota";
$m->warna = "Merah";
echo $m->info();`, a: c`<?php
class Mobil {
    public $merk;
    public $warna;

    public function info() {

    }
}

$m = new Mobil();
$m->merk = "Toyota";
$m->warna = "Merah";
echo $m->info();`, h: 'return "Mobil " . $this->merk . " warna " . $this->warna;', need: [['\\$this->', 'Gunakan $this->merk dan $this->warna.']] },
  { t: 'Buat class <code>Mahasiswa</code> dengan constructor <code>($nama, $npm)</code> dan method <code>perkenalan()</code> yang mengembalikan <code>Halo, saya Rina (NPM 12345678)</code>.', s: c`<?php
// buat class Mahasiswa

$mhs = new Mahasiswa("Rina", "12345678");
echo $mhs->perkenalan();`, a: c`<?php

        $this->nama = $nama;

$mhs = new Mahasiswa("Rina", "12345678");

  { t: 'Class <code>Lampu</code> punya property <b>private</b> <code>$nyala = false</code>. Buat method <code>nyalakan()</code> dan <code>status()</code> (mengembalikan "Lampu nyala"/"Lampu mati"). Output:<pre>Lampu mati\nLampu nyala</pre>', s: c`<?php
class Lampu {
    // property dan method di sini
}

$l = new Lampu();
echo $l->status(), "\n";
$l->nyalakan();
echo $l->status();`, a: c`<?php

$l = new Lampu();

]},
{ id: 'enkap', title: 'Enkapsulasi & Static', steps: [
  { say: 'public bisa diakses dari mana saja. private hanya dari dalam class itu. Gunanya melindungi data dari perubahan sembarangan.', code: c`<?php
class Dompet {
    private $isi = 0;

    public function tambah($uang) {
        if ($uang > 0) {
            $this->isi += $uang;
        }
    }

    public function getIsi() {
        return $this->isi;
    }
}
$d = new Dompet();
$d->tambah(20000);
echo $d->getIsi();
// $d->isi = 999999; // ini akan error!` },
  { say: 'Method seperti getIsi() disebut getter. Data diakses lewat method, jadi kamu bisa menambah aturan (validasi).' },
  { say: 'static = milik class, bukan milik object. Diakses dengan NamaClass::$prop atau self::$prop di dalam class.', code: c`<?php

    public static $terjual = 0;

    public function __construct() {
        self::$terjual++;
    }
}
new Tiket();
new Tiket();
echo "Tiket terjual: " . Tiket::$terjual;` }
], ex: [
  { t: 'Lengkapi class <code>Rekening</code>: <code>setor($n)</code>, <code>tarik($n)</code> (jika saldo kurang, echo <code>Saldo tidak cukup</code> + baris baru dan jangan kurangi), dan <code>getSaldo()</code>.', s: c`<?php
class Rekening {

    // buat method setor, tarik, getSaldo

$r = new Rekening();

$r->tarik(30000);

echo "Saldo: " . $r->getSaldo();`, a: c`<?php

  { t: 'Buat class <code>Pengunjung</code> dengan property <b>static</b> <code>$jumlah</code> yang bertambah setiap object dibuat. Setelah 3 object: <code>Total pengunjung: 3</code>', s: c`<?php

]},
{ id: 'waris', title: 'Pewarisan & Exception', steps: [
  { say: 'Pewarisan (inheritance): class anak mewarisi semua isi class induk lewat extends. Anak bisa menimpa (override) method induk.', code: c`<?php
class Hewan {
    protected $nama;
    public function __construct($nama) {
        $this->nama = $nama;
    }
    public function suara() {
        return "...";
    }
    public function bicara() {
        return "{$this->nama}: " . $this->suara();
    }
}
class Bebek extends Hewan {
    public function suara() {
        return "Kwek!";
    }
}
$b = new Bebek("Donal");
echo $b->bicara();` },
  { say: 'protected mirip private, tapi masih bisa diakses class anak. parent:: dipakai untuk memanggil method milik induk.', code: c`<?php
class Pegawai {
    public function __construct(protected $nama) {}
}
class Dosen extends Pegawai {
    public function __construct($nama, private $matkul) {
        parent::__construct($nama);
    }
    public function info() {
        return "{$this->nama} mengajar {$this->matkul}";
    }
}
echo (new Dosen("Pak Budi", "Basis Data"))->info();` },
  { say: 'Exception untuk menangani error dengan rapi. throw melempar error, try...catch menangkapnya supaya program tidak mati.', code: c`<?php
function cekUmur($umur) {
    if ($umur < 0) {
        throw new Exception("Umur tidak boleh negatif");
    }
    return "Umur valid";
}
try {
    echo cekUmur(-5);
} catch (Exception $e) {
    echo "Error: " . $e->getMessage();
}` }
], ex: [
  { t: 'Buat class <code>Kucing</code> dan <code>Anjing</code> yang <b>extends</b> <code>Hewan</code>, masing-masing override <code>suara()</code> jadi <code>Meong</code> dan <code>Guk guk</code>. Output:<pre>Oyen berkata Meong\nBlacky berkata Guk guk</pre>', s: c`<?php
class Hewan {
    protected $nama;
    public function __construct($nama) {
        $this->nama = $nama;
    }
    public function suara() {
        return "...";
    }
    public function perkenalan() {
        return "{$this->nama} berkata " . $this->suara();
    }
}

// buat class Kucing dan Anjing

echo (new Kucing("Oyen"))->perkenalan(), "\n";
echo (new Anjing("Blacky"))->perkenalan();`, a: c`<?php
class Hewan {
    protected $nama;
    public function __construct($nama) {
        $this->nama = $nama;
    }
    public function suara() {
        return "...";
    }
    public function perkenalan() {
        return "{$this->nama} berkata " . $this->suara();
    }

class Kucing extends Hewan {
    public function suara() {
        return "Meong";
    }
}

class Anjing extends Hewan {

    }
}

echo (new Kucing("Oyen"))->perkenalan(), "\n";
echo (new Anjing("Blacky"))->perkenalan();`, h: 'class Kucing extends Hewan { public function suara() { return "Meong"; } }', need: [['extends\\s+Hewan[\\s\\S]*extends\\s+Hewan', 'Kedua class harus extends Hewan.']] },
  { t: 'Class <code>Manajer</code> extends <code>Karyawan</code>, punya tambahan <code>$tunjangan</code>. Constructor-nya memanggil <code>parent::__construct</code>. Method <code>totalGaji()</code> = gaji + tunjangan. Output: <code>Total gaji Sari: 12000000</code>', s: c`<?php
class Karyawan {
    protected $nama;
    protected $gaji;
    public function __construct($nama, $gaji) {
        $this->nama = $nama;
        $this->gaji = $gaji;
    }
}

// buat class Manajer

$m = new Manajer("Sari", 9000000, 3000000);
echo "Total gaji Sari: " . $m->totalGaji();`, a: c`<?php
class Karyawan {
    protected $nama;
    protected $gaji;
    public function __construct($nama, $gaji) {
        $this->nama = $nama;
        $this->gaji = $gaji;
    }
}

class Manajer extends Karyawan {
    private $tunjangan;

        parent::__construct($nama, $gaji);
        $this->tunjangan = $tunjangan;
    }
    public function totalGaji() {
        return $this->gaji + $this->tunjangan;
    }
}

$m = new Manajer("Sari", 9000000, 3000000);
echo "Total gaji Sari: " . $m->totalGaji();`, h: 'Di constructor Manajer: parent::__construct($nama, $gaji); lalu $this->tunjangan = $tunjangan;', need: [['parent::__construct', 'Panggil parent::__construct.']] },
  { t: 'Fungsi <code>bagi($a, $b)</code> harus <b>throw Exception</b> berpesan <code>Tidak bisa dibagi nol</code> jika $b = 0. Tangkap dengan try/catch. Output:<pre>Hasil: 5\nError: Tidak bisa dibagi nol</pre>', s: c`<?php
function bagi($a, $b) {
    // tulis di sini

try {
    echo "Hasil: " . bagi(10, 2) . "\n";
    echo "Hasil: " . bagi(10, 0) . "\n";

    echo "Error: " . $e->getMessage();
}`, a: c`<?php

    if ($b == 0) {
        throw new Exception("Tidak bisa dibagi nol");
    }
    return $a / $b;
}

try {
    echo "Hasil: " . bagi(10, 2) . "\n";
    echo "Hasil: " . bagi(10, 0) . "\n";

    echo "Error: " . $e->getMessage();
}`, h: 'if ($b == 0) { throw new Exception("Tidak bisa dibagi nol"); } return $a / $b;', need: [['throw\\s+new', 'Gunakan throw new Exception(...).']] }
]}
]},

  { t: '<b>Palindrom</b>: buat fungsi <code>isPalindrom($kata)</code>. Untuk setiap kata di <code>$kata</code> tampilkan <code>katak: palindrom</code> atau <code>makan: bukan</code>.', s: c`<?php
$kata = ["katak", "makan", "level", "kodok", "php"];
`, a: c`<?php
$kata = ["katak", "makan", "level", "kodok", "php"];
function isPalindrom($k) {
    return $k == strrev($k);

  { t: 'Urutkan <code>$mhs</code> berdasarkan nilai tertinggi (pakai <code>usort</code>), lalu tampilkan peringkat: <code>1. Bela (91) - A</code>. Grade: 85+ A, 70+ B, 55+ C, sisanya D.', s: c`<?php
$mhs = [

];
`, a: c`<?php
$mhs = [
    ["nama" => "Andi", "nilai" => 72],
    ["nama" => "Bela", "nilai" => 91],
    ["nama" => "Caca", "nilai" => 85],
    ["nama" => "Dodi", "nilai" => 50],
];
function grade($n) {

  { t: '<b>Bos Final OOP</b>: buat class <code>Produk</code> (nama, harga) dan class <code>Keranjang</code> dengan method <code>tambah(Produk $p, $qty)</code>, <code>total()</code>, dan <code>jumlahItem()</code>. Output:<pre>Item: 3\nTotal: 85000</pre>', s: c`<?php
// buat class Produk dan Keranjang

$k = new Keranjang();
$k->tambah(new Produk("Buku", 25000), 2);
$k->tambah(new Produk("Pensil", 5000), 3);
$k->tambah(new Produk("Tas", 20000), 1);
echo "Item: " . $k->jumlahItem() . "\n";
echo "Total: " . $k->total();`, a: c`<?php
class Produk {
    public function __construct(public $nama, public $harga) {}
}

class Keranjang {
    private $isi = [];

    public function tambah(Produk $p, $qty) {
        $this->isi[] = ["produk" => $p, "qty" => $qty];
    }

    public function jumlahItem() {
        return count($this->isi);
    }

    public function total() {
        $t = 0;
        foreach ($this->isi as $baris) {
            $t += $baris["produk"]->harga * $baris["qty"];
        }
        return $t;
    }
}

$k = new Keranjang();
$k->tambah(new Produk("Buku", 25000), 2);
$k->tambah(new Produk("Pensil", 5000), 3);
$k->tambah(new Produk("Tas", 20000), 1);
echo "Item: " . $k->jumlahItem() . "\n";
echo "Total: " . $k->total();`, h: 'Keranjang menyimpan array berisi ["produk" => $p, "qty" => $qty]. total() menjumlahkan harga * qty.', need: [['class\\s+Produk', 'Buat class Produk.'], ['class\\s+Keranjang', 'Buat class Keranjang.']] }
]}
]}

ifelse: [

for: [

};
function applySteps(worlds) {
  for (const w of worlds) for (const l of w.lessons) if (STEPS[l.id]) l.steps = STEPS[l.id];
  const desa = worlds[0];
  if (!desa.lessons.some(l => l.id === 'komentar')) {
    KOMENTAR_LESSON.steps = STEPS.komentar;
    const idx = desa.lessons.findIndex(l => l.id === 'angka');
    desa.lessons.splice(idx, 0, KOMENTAR_LESSON);
  }
  const ang = desa.lessons.find(l => l.id === 'angka');
  ang.title = 'Hitung-hitungan';
  if (ang.ex.length === 3) ang.ex.push(EXTRA_EX.angka);
  desa.blurb = 'Tempat semua petualang mulai: echo, komentar, dan berhitung.';
}
applySteps(WORLDS);
if (typeof module !== 'undefined') module.exports = STEPS;

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const run = (code) => MiniPHP.runPHP(code);

/* ================= state ================= */
const KEY = 'kancil-php-quest-v1';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let S = { xp: 0, done: {}, streak: { last: null, count: 0 }, daily: { date: null, count: 0, claimed: false }, chests: {}, sound: true, seen: {}, code: {}, intro: false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };

const ALL = []; // flat lessons
WORLDS.forEach((w, wi) => w.lessons.forEach((l, li) => { l.world = w; l.wi = wi; l.li = li; l.gi = ALL.length; l.ex.forEach((e, ei) => { e.id = l.id + '-' + ei; }); ALL.push(l); }));
const exDone = (e) => !!S.done[e.id];
const lessonDone = (l) => l.ex.every(exDone);
const lessonStars = (l) => l.ex.filter(exDone).length;
const lessonOpen = (l) => l.gi === 0 || lessonDone(ALL[l.gi - 1]) || l.ex.some(exDone);
const worldDone = (w) => w.lessons.every(lessonDone);
const curLesson = () => ALL.find(l => !lessonDone(l)) || ALL[ALL.length - 1];
const totalEx = ALL.reduce((n, l) => n + l.ex.length, 0);

const LEVELS = ['Petualang Pemula', 'Penjelajah Desa', 'Pemburu Variabel', 'Penyeberang Sungai', 'Penakluk Gua', 'Saudagar Array', 'Penyihir Fungsi', 'Ksatria Kastil', 'Pendekar PHP', 'Master PHP'];
const levelOf = (xp) => Math.floor(xp / 120) + 1;
const levelName = (lv) => LEVELS[Math.min(lv - 1, LEVELS.length - 1)];

function touchStreak() {
  const t = today();
  S.days = S.days || {}; S.days[t] = 1;
  if (S.streak.last === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  S.streak.count = S.streak.last === ys ? S.streak.count + 1 : 1;
  S.streak.last = t;
}

function checkCode(ev) {
  const e = cur(); const code = L.editor.get();
  if (!code.replace(/<\?php/, '').trim()) { SFX.bad(); say($('#dbox'), pick(LINES.empty), 'bad'); return; }
  const g = grade(run, e, code);
  let extra = '';
  if (g.reason === 'output' || g.reason === 'vary') extra = (g.reason === 'vary' ? `<div class="diag warning"><b>Tes tambahan</b>: nilai diganti menjadi ${esc(Object.entries(g.vary).map(([k, v]) => '$' + k + ' = ' + v).join(', '))}</div>` : '') + diffView(g.expected, g.got);
  renderConsole($('#console'), g.run, extra); mobScroll();
  const bad = g.run.diags.find(d => d.kind !== 'warning'); L.editor.mark(bad ? bad.line : 0);
  if (g.ok) {
    SFX.good();
    const first = !exDone(e);
    const xp = L.shown[e.id] ? 3 : L.hinted[e.id] ? 5 : 10;
    let comboTxt = '';
    if (first) {
      S.done[e.id] = { t: Date.now(), xp }; const d = dailyState(); d.count++; touchStreak();
      if (!L.fails[e.id] && !L.hinted[e.id]) combo++; else combo = 0;
      let bonus = 0;
      if (combo >= 2) { bonus = Math.min(combo, 5) * 2; showCombo(combo, bonus); comboTxt = ' Combo x' + combo + '! Bonus <code>+' + bonus + ' XP</code>.'; }
      S.bestCombo = Math.max(S.bestCombo || 0, combo);
      addXP(xp + bonus, ev); save();
    }
    say($('#dbox'), (L.hinted[e.id] ? pick(LINES.goodHint) : pick(LINES.good)) + (first ? ' <code>+' + xp + ' XP</code>' : '') + comboTxt, 'good');

        confetti(); SFX.level();
        const w = L.l.world;

        modal({ sprite: KANCIL_HAPPY, title: L.l.world.boss ? 'Bos dikalahkan!' : 'Pelajaran Tuntas!', text: '“' + esc(L.l.title) + '” selesai dengan ' + lessonStars(L.l) + ' bintang.' + (wdone ? ' Seluruh ' + esc(w.name) + ' sudah kamu taklukkan, peti hadiah dan sertifikat menunggu di peta!' : ''), btn: wdone ? 'Buka peti di peta' : 'Lanjut', onClose: () => { if (wdone) go('peta'); } });
      }, 900);

  L.fails[e.id] = (L.fails[e.id] || 0) + 1;
  let msg;

  else if (g.reason === 'need') msg = pick(LINES.need).replace('{msg}', esc(g.detail));
  else msg = pick(LINES[g.reason]);

  say($('#dbox'), msg, 'bad');
  if (L.fails[e.id] === 2) renderEx(false);
}
