<title>Kancil PHP Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: game shell — left nav · center stage (map / lesson) · right profile; collapses to top bar + bottom tabs on phones */
:root {
  --bg: #11131b; --panel: #191c27; --panel2: #222636; --line: #363c54; --line2: #4a5172;
  --ink: #ece8d9; --muted: #9196ab; --gold: #f2c14e; --gold2: #b98a1f; --indigo: #7d82ef; --indigo2: #4d52b8;
  --good: #63d690; --bad: #ff6f6f; --code-bg: #0d0f15; --kw: #c49bff; --str: #9be28a; --var: #ffcf7a; --num: #ff9e7a; --cm: #6b7190; --fn: #7fc8ff;
  --f-pixel: 'Pixelify Sans', 'Courier New', monospace; --f-dlg: 'VT323', 'Courier New', monospace; --f-code: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-pixel); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
/* app bar */
.appbar { display: flex; align-items: center; gap: 18px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 3px solid var(--line); position: relative; z-index: 8; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 2px 4px; text-align: left; flex: none; }
.brand canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.brand b { display: block; font-size: 18px; line-height: 1; letter-spacing: .5px; }
.brand small { display: block; font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
.toptabs { display: flex; gap: 4px; flex: 1; min-width: 0; justify-content: center; }
.toptabs button { display: flex; align-items: center; gap: 8px; background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font-size: 15px; color: var(--muted); white-space: nowrap; }
.toptabs button svg { width: 18px; height: 18px; flex: none; }
.toptabs button:hover { color: var(--ink); }
.toptabs button.on { color: var(--gold); border-bottom-color: var(--gold); background: linear-gradient(180deg, transparent 60%, rgba(242,193,78,.08)); }
.abstats { display: flex; align-items: center; gap: 8px; flex: none; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 2px solid var(--line2); padding: 5px 9px; font-variant-numeric: tabular-nums; font-size: 15px; }
.chip svg { width: 16px; height: 16px; }
.lvchip { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 2px solid var(--line2); padding: 3px 10px 3px 4px; }
.lvchip:hover { border-color: var(--gold); }
.lvchip canvas { width: 30px; height: 30px; image-rendering: pixelated; }
.lvt { display: flex; flex-direction: column; gap: 3px; min-width: 64px; text-align: left; }
.lvt b { font-size: 13px; white-space: nowrap; }
.mini { display: block; height: 6px; background: var(--code-bg); border: 1px solid var(--line2); position: relative; }
.mini i { position: absolute; inset: 0 auto 0 0; background: var(--gold); }
.iconbtn { display: grid; place-items: center; width: 38px; height: 38px; background: var(--panel2); border: 2px solid var(--line2); color: var(--muted); }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
/* shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.dash { display: none; }
@media (min-width: 1100px) {
  body[data-view="peta"] .shell { grid-template-columns: 330px minmax(0, 1fr); }
  body[data-view="peta"] .dash { display: flex; }
  body[data-view="peta"] .maphead, body[data-view="peta"] .mapwrap { max-width: 700px; }
}
.dash { flex-direction: column; gap: 12px; padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; overflow-y: auto; min-height: 0; background: linear-gradient(90deg, var(--bg), var(--bg)); border-right: 3px solid var(--line); }
.dc { background: var(--panel); border: 3px solid var(--line2); padding: 14px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.dc h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.cont { border-color: var(--gold2); background: linear-gradient(180deg, #2a2618 0, var(--panel) 70%); }
.cont .eyebrow { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
.cont .ct { font-size: 22px; margin: 6px 0 2px; line-height: 1.1; text-wrap: balance; }
.cont .cs { font-family: var(--f-dlg); font-size: 19px; color: var(--muted); }
.cont .cprog { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cont .cprog .bar { flex: 1; margin: 0; }
.cont .px { width: 100%; }
.profrow { display: flex; align-items: center; gap: 12px; }
.profrow canvas { width: 56px; height: 56px; image-rendering: pixelated; background: var(--panel2); border: 2px solid var(--line2); }
.lvname { font-size: 17px; }
.lvsub { color: var(--gold); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.sgrid div { background: var(--panel2); border: 2px solid var(--line); padding: 8px 10px; }
.sgrid b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.sgrid span { font-family: var(--f-dlg); font-size: 16px; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.week i { width: 100%; aspect-ratio: 1; max-width: 30px; background: var(--code-bg); border: 2px solid var(--line2); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.week .on i { background: #ff8a4c; border-color: #ffb48a; color: #2a1206; }
.week .today span { color: var(--gold); }
.week .today i { outline: 2px solid var(--gold); outline-offset: 1px; }
.navnote { font-family: var(--f-dlg); font-size: 16px; color: var(--muted); line-height: 1.15; margin: 0; padding: 0 4px; }
.stage { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
.view { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view[hidden] { display: none !important; }
.bar { height: 14px; background: var(--code-bg); border: 2px solid var(--line2); position: relative; margin-top: 10px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, var(--gold2) 6px 8px); transition: width .4s steps(8); }
.barlabel { font-family: var(--f-dlg); font-size: 17px; color: var(--muted); margin-top: 4px; }
.quest h4 { color: var(--gold); }
.quest p { margin: 0; font-family: var(--f-dlg); font-size: 19px; line-height: 1.1; }
.quest .qbtn { margin-top: 10px; width: 100%; }
.worlds { display: flex; flex-direction: column; gap: 4px; }
.wrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); background: none; border: 2px solid transparent; padding: 5px 6px; text-align: left; }
.wrow:hover { border-color: var(--line2); background: var(--panel2); }
.wrow.cur { border-color: var(--gold2); }
.wrow em { font-style: normal; color: var(--gold); font-size: 12px; }
.wrow b { color: var(--ink); font-weight: 400; }
.wrow .bar { grid-column: 2 / -1; height: 6px; margin: 0; border-width: 1px; }
.wrow .bar i { background: var(--indigo); }
.wrow.full .bar i { background: var(--good); }
.fab { position: fixed; z-index: 30; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 28px); display: none; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 6px 0 rgba(0,0,0,.45), inset -3px -3px 0 rgba(0,0,0,.25); }
@media (max-width: 1099px) { body[data-view="peta"] .fab { display: flex; } }
.sheet .mbox { text-align: left; max-height: 86vh; overflow-y: auto; }
.sheet .dc { box-shadow: none; margin-bottom: 10px; }
/* pixel buttons */
.px { border: 3px solid var(--line2); background: var(--panel2); padding: 9px 16px; font-size: 15px; letter-spacing: .5px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.06); }
.px:hover { border-color: var(--muted); }
.px:active { box-shadow: inset 3px 3px 0 rgba(0,0,0,.4); transform: translateY(1px); }
.px.gold { background: var(--gold); color: #2a1d02; border-color: #ffe08f; }
.px.gold:hover { border-color: #fff3c8; }
.px.indigo { background: var(--indigo2); border-color: var(--indigo); }
.px.good { background: #2f7a4b; border-color: var(--good); }
.px:disabled { opacity: .45; cursor: not-allowed; }
/* map */
.maphead { max-width: 600px; margin: 0 auto; border: 3px solid #0b0c10; outline: 3px solid var(--line2); background: var(--panel); display: grid; grid-template-columns: 66px 1fr; box-shadow: 0 8px 0 rgba(0,0,0,.35); position: sticky; top: 0; z-index: 6; }
.maphead .num { display: grid; place-items: center; font-size: 28px; color: var(--gold); border-right: 3px solid var(--line2); background: repeating-linear-gradient(180deg, #232738 0 4px, #1f2232 4px 8px); }
.maphead .txt { padding: 9px 16px 10px; min-width: 0; }
.maphead .txt b { display: block; font-size: 19px; letter-spacing: 1.5px; text-transform: uppercase; }
.maphead .txt span { font-family: var(--f-dlg); font-size: 18px; color: var(--muted); }
.mhbar { height: 8px; margin-top: 6px; background: var(--code-bg); border: 2px solid #0b0c10; position: relative; }
.mhbar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, var(--gold2) 6px 8px); transition: width .3s steps(6); }
.mapwrap { position: relative; max-width: 600px; margin: 0 auto; border-left: 4px solid #0b0c10; border-right: 4px solid #0b0c10; box-shadow: 3px 0 0 var(--line2), -3px 0 0 var(--line2); }
.mapwrap > canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.mapwrap > #mapFx { position: absolute; inset: 0; height: 100%; pointer-events: none; }
.node { position: absolute; width: 15%; max-width: 86px; aspect-ratio: 1; transform: translate(-50%, -50%); border: none; background: none; padding: 0; --hi: #9ea3b6; --mid: #6a6f84; --lo: #444859; --ink2: #d8d9e3; }
.node::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -8%; height: 16%; background: rgba(0,0,0,.38); border-radius: 50%; z-index: -1; }
.node.open { --hi: #c3c6ff; --mid: #7d82ef; --lo: #4d52b8; --ink2: #fff; }
.node.done { --hi: #fff0b8; --mid: #f2c14e; --lo: #b98a1f; --ink2: #2a1d02; }
.node.boss.open { --hi: #ffb8ad; --mid: #e0574a; --lo: #9a2f26; --ink2: #fff; }
.node.boss.done { --hi: #fff0b8; --mid: #f2c14e; --lo: #b98a1f; }
.node .stone { position: absolute; inset: 0; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); background: #0d0e14; display: grid; place-items: center; }
.node .stone::before { content: ""; position: absolute; inset: 8%; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); background: linear-gradient(180deg, var(--hi) 0 24%, var(--mid) 24% 70%, var(--lo) 70%); }
.node .stone::after { content: ""; position: absolute; left: 26%; top: 16%; width: 18%; height: 8%; background: rgba(255,255,255,.55); }
.node .stone .n { position: relative; z-index: 1; display: grid; place-items: center; width: 100%; height: 100%; font-size: clamp(14px, 3.4vw, 22px); font-weight: 700; color: var(--ink2); text-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.node.done .stone .n { text-shadow: 1px 1px 0 rgba(255,255,255,.4); }
.node:hover .stone::before, .node:focus-visible .stone::before { filter: brightness(1.12); }
.node.cur::before { content: ""; position: absolute; inset: -16%; border: 3px solid var(--gold); border-radius: 50%; animation: ring 1.2s steps(6) infinite; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
.node .lbl { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 9px); white-space: nowrap; font-size: clamp(10px, 2.4vw, 13px); background: #3a2514; border: 2px solid #140b05; box-shadow: 0 2px 0 #140b05, inset 0 2px 0 #5a3a20; padding: 2px 8px; color: #f6e7c6; pointer-events: none; }
.node.locked .lbl { background: #23252f; box-shadow: 0 2px 0 #0d0e14, inset 0 2px 0 #343747; color: #a7aabb; border-color: #0d0e14; }
.node .stars { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 12px; color: var(--gold); letter-spacing: 1px; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; white-space: nowrap; }
.node .stars em { font-style: normal; color: rgba(255,255,255,.35); }
.chest { position: absolute; width: 10%; aspect-ratio: 4/3; transform: translate(-50%, -50%); background: none; border: none; padding: 0; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.chest canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.chest.ready { animation: wiggle .8s steps(4) infinite; }
.hero { position: absolute; width: 11%; aspect-ratio: 1; transform: translate(-50%, -100%); pointer-events: none; transition: left .5s steps(6), top .5s steps(6); filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
.hero canvas { width: 100%; height: 100%; image-rendering: pixelated; animation: bob 1s steps(2) infinite; }
.banner { position: absolute; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: stretch; background: repeating-linear-gradient(180deg, #7a5230 0 7px, #6b4423 7px 9px); border: 3px solid #241306; box-shadow: 0 4px 0 rgba(0,0,0,.4), inset 0 2px 0 #9a6a3e; white-space: nowrap; pointer-events: none; z-index: 2; }
.banner::before, .banner::after { content: ""; position: absolute; bottom: -14px; width: 6px; height: 12px; background: #3b2412; border: 2px solid #241306; border-top: none; }
.banner::before { left: 14px; } .banner::after { right: 14px; }
.banner i { font-style: normal; display: grid; place-items: center; min-width: 30px; background: #241306; color: var(--gold); font-size: clamp(12px, 3vw, 16px); }
.banner span { padding: 5px 14px; font-size: clamp(12px, 3vw, 16px); letter-spacing: 2px; text-transform: uppercase; color: #fff1d0; text-shadow: 2px 2px 0 #241306; }
.banner.done i { background: var(--gold); color: #241306; }
@keyframes bob { 50% { transform: translateY(-6%); } }
@keyframes pulse { 50% { filter: brightness(1.3); transform: scale(1.06); } }
@keyframes wiggle { 25% { transform: translate(-50%, -50%) rotate(-6deg); } 75% { transform: translate(-50%, -50%) rotate(6deg); } }
/* lesson */
.lesson { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.lhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lhead .crumb { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
.lhead h2 { margin: 0; font-size: 26px; font-weight: 600; flex: 1; min-width: 200px; text-wrap: balance; }
.dialog { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: end; }
.portrait { width: 96px; height: 96px; background: var(--panel2); border: 3px solid var(--line2); display: grid; place-items: center; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35); }
.portrait canvas { width: 80px; height: 80px; image-rendering: pixelated; }
.dbox { background: #0c0d13; border: 3px solid #e9e4cf; outline: 3px solid #000; box-shadow: 0 0 0 6px #000; padding: 14px 18px 12px; min-height: 96px; position: relative; font-family: var(--f-dlg); font-size: 23px; line-height: 1.2; }
.dbox .who { position: absolute; top: -14px; left: 14px; background: #e9e4cf; color: #0c0d13; font-family: var(--f-pixel); font-size: 13px; padding: 1px 8px; letter-spacing: 1px; }
.dbox .say { min-height: 2.4em; }
.dbox .say code, .task code { font-family: var(--f-code); font-size: .72em; background: #1d2030; padding: 1px 5px; color: var(--var); }
.dbox .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.dbox .prog { font-family: var(--f-pixel); font-size: 12px; color: var(--muted); letter-spacing: 1px; }
#dbtns { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.dbtn { background: none; border: none; font-family: var(--f-pixel); font-weight: 700; font-size: 16px; letter-spacing: 1px; padding: 4px 6px; color: var(--ink); }
.dbtn:hover { color: var(--gold); }
.dbtn.next::after { content: ' ▼'; display: inline-block; animation: blinkY .7s steps(2) infinite; }
@keyframes blinkY { 50% { transform: translateY(3px); } }
.dbox.mood-good { border-color: var(--good); }
.dbox.mood-good .who { background: var(--good); }
.dbox.mood-bad { border-color: var(--bad); }
.dbox.mood-bad .who { background: var(--bad); }
.work { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 3px solid var(--line2); box-shadow: inset -3px -3px 0 rgba(0,0,0,.3); min-width: 0; }
.card > h3 { margin: 0; padding: 9px 14px; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card .body { padding: 14px; min-width: 0; }
.example pre { margin: 0; overflow-x: auto; background: var(--code-bg); padding: 12px 14px; font-family: var(--f-code); font-size: 13px; line-height: 1.55; border: 2px solid #000; }
.example .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.reslabel { margin: 10px 0 4px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.example pre.result { background: #07080c; color: #e9f5e6; border-color: #2f7a4b; white-space: pre-wrap; word-break: break-word; }
.note { margin-top: 12px; padding: 10px 12px; background: var(--panel2); border-left: 4px solid var(--indigo); font-family: var(--f-dlg); font-size: 19px; line-height: 1.25; }
.note code { font-family: var(--f-code); font-size: 13px; background: #11131b; padding: 1px 5px; color: var(--var); }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.opt { text-align: left; background: var(--panel2); border: 3px solid var(--line2); padding: 10px 12px; font-family: var(--f-code); font-size: 14px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.35); }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.right { border-color: var(--good); background: #1e3b2a; color: #c9f5d8; }
.opt.wrong { border-color: var(--bad); background: #3a1d22; color: #ffc1c1; text-decoration: line-through; }
.opt:disabled { cursor: default; }
.task code { font-family: var(--f-code); font-size: .72em; background: #1d2030; padding: 1px 5px; color: var(--var); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 3px solid var(--line2); background: var(--panel2); padding: 6px 12px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tab.on { background: var(--indigo2); border-color: var(--indigo); color: #fff; }
.tab.done { color: var(--gold); }
.tab.done.on { color: #fff; }
.task { font-family: var(--f-dlg); font-size: 21px; line-height: 1.22; }
.task pre { font-family: var(--f-code); font-size: 13px; background: var(--code-bg); padding: 8px 10px; margin: 8px 0 0; border: 2px solid #000; overflow-x: auto; line-height: 1.5; }
.task .tacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.hintbox { margin-top: 12px; border: 2px dashed var(--gold2); padding: 8px 10px; color: var(--gold); font-size: 19px; }
.answer pre { margin: 8px 0 0; }
.lessonlist { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
/* editor */
.editor { position: relative; background: var(--code-bg); border-bottom: 3px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); font-family: var(--f-code); font-size: 14px; --lh: 21px; line-height: var(--lh); height: 340px; overflow: hidden; }
.gutter { padding: 12px 8px 12px 10px; text-align: right; color: #4c5370; user-select: none; overflow: hidden; border-right: 2px solid #1d2030; font-variant-numeric: tabular-nums; min-width: 40px; }
.gutter div { height: var(--lh); }
.gutter .errline { color: #fff; background: var(--bad); }
.codearea { position: relative; min-width: 0; }
.codearea textarea, .codearea pre { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: inherit; line-height: inherit; white-space: pre; overflow: auto; tab-size: 4; border: none; letter-spacing: 0; word-spacing: 0; }

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const run = (code) => MiniPHP.runPHP(code);

/* ================= state ================= */
const KEY = 'kancil-php-quest-v1';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let S = { xp: 0, done: {}, streak: { last: null, count: 0 }, daily: { date: null, count: 0, claimed: false }, chests: {}, sound: true, seen: {}, code: {}, intro: false };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };

const ALL = []; // flat lessons
WORLDS.forEach((w, wi) => w.lessons.forEach((l, li) => { l.world = w; l.wi = wi; l.li = li; l.gi = ALL.length; l.ex.forEach((e, ei) => { e.id = l.id + '-' + ei; }); ALL.push(l); }));
const exDone = (e) => !!S.done[e.id];
const lessonDone = (l) => l.ex.every(exDone);
const lessonStars = (l) => l.ex.filter(exDone).length;
const lessonOpen = (l) => l.gi === 0 || lessonDone(ALL[l.gi - 1]) || l.ex.some(exDone);
const worldDone = (w) => w.lessons.every(lessonDone);
const curLesson = () => ALL.find(l => !lessonDone(l)) || ALL[ALL.length - 1];
const totalEx = ALL.reduce((n, l) => n + l.ex.length, 0);

const LEVELS = ['Petualang Pemula', 'Penjelajah Desa', 'Pemburu Variabel', 'Penyeberang Sungai', 'Penakluk Gua', 'Saudagar Array', 'Penyihir Fungsi', 'Ksatria Kastil', 'Pendekar PHP', 'Master PHP'];
const levelOf = (xp) => Math.floor(xp / 120) + 1;
const levelName = (lv) => LEVELS[Math.min(lv - 1, LEVELS.length - 1)];

function touchStreak() {
  const t = today();
  S.days = S.days || {}; S.days[t] = 1;
  if (S.streak.last === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  S.streak.count = S.streak.last === ys ? S.streak.count + 1 : 1;
  S.streak.last = t;
}
function dailyState() { if (S.daily.date !== today()) S.daily = { date: today(), count: 0, claimed: false }; return S.daily; }

/* ================= sound ================= */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, { type = 'square', vol = 0.08, at = 0, slide = 0 } = {}) {

function checkCode(ev) {
  const e = cur(); const code = L.editor.get();
  if (!code.replace(/<\?php/, '').trim()) { SFX.bad(); say($('#dbox'), pick(LINES.empty), 'bad'); return; }
  const g = grade(run, e, code);
  let extra = '';
  if (g.reason === 'output' || g.reason === 'vary') extra = (g.reason === 'vary' ? `<div class="diag warning"><b>Tes tambahan</b>: nilai diganti menjadi ${esc(Object.entries(g.vary).map(([k, v]) => '$' + k + ' = ' + v).join(', '))}</div>` : '') + diffView(g.expected, g.got);
  renderConsole($('#console'), g.run, extra); mobScroll();
  const bad = g.run.diags.find(d => d.kind !== 'warning'); L.editor.mark(bad ? bad.line : 0);
  if (g.ok) {
    SFX.good();
    const first = !exDone(e);
    const xp = L.shown[e.id] ? 3 : L.hinted[e.id] ? 5 : 10;
    let comboTxt = '';
    if (first) {
      S.done[e.id] = { t: Date.now(), xp }; const d = dailyState(); d.count++; touchStreak();
      if (!L.fails[e.id] && !L.hinted[e.id]) combo++; else combo = 0;
      let bonus = 0;
      if (combo >= 2) { bonus = Math.min(combo, 5) * 2; showCombo(combo, bonus); comboTxt = ' Combo x' + combo + '! Bonus <code>+' + bonus + ' XP</code>.'; }
      S.bestCombo = Math.max(S.bestCombo || 0, combo);
      addXP(xp + bonus, ev); save();
    }
    say($('#dbox'), (L.hinted[e.id] ? pick(LINES.goodHint) : pick(LINES.good)) + (first ? ' <code>+' + xp + ' XP</code>' : '') + comboTxt, 'good');

        confetti(); SFX.level();
        const w = L.l.world;

        modal({ sprite: KANCIL_HAPPY, title: L.l.world.boss ? 'Bos dikalahkan!' : 'Pelajaran Tuntas!', text: '“' + esc(L.l.title) + '” selesai dengan ' + lessonStars(L.l) + ' bintang.' + (wdone ? ' Seluruh ' + esc(w.name) + ' sudah kamu taklukkan, peti hadiah dan sertifikat menunggu di peta!' : ''), btn: wdone ? 'Buka peti di peta' : 'Lanjut', onClose: () => { if (wdone) go('peta'); } });
      }, 900);

  L.fails[e.id] = (L.fails[e.id] || 0) + 1;
  let msg;

  else if (g.reason === 'need') msg = pick(LINES.need).replace('{msg}', esc(g.detail));
  else msg = pick(LINES[g.reason]);

  say($('#dbox'), msg, 'bad');
  if (L.fails[e.id] === 2) renderEx(false);
}

const RV_LOCAL = 'kpq-ulasan-lokal', SR_LOCAL = 'kpq-saran-lokal';
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (_) { return []; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
async function sbReq(path, opt = {}) {
  const r = await fetch(REVIEW.url.replace(/\/$/, '') + '/rest/v1/' + path, Object.assign({}, opt, { headers: Object.assign({ apikey: REVIEW.key, 'Content-Type': 'application/json' }, /^eyJ/.test(REVIEW.key) ? { Authorization: 'Bearer ' + REVIEW.key } : {}, opt.headers || {}) }));
  if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(r.status + ' ' + t); }
  return r.status === 204 || r.headers.get('content-length') === '0' ? null : r.json();
}
async function fetchReviews(limit = 300) {
  if (rvOnline()) return await sbReq('ulasan?select=id,dibuat,nama,bintang,komentar&order=dibuat.desc&limit=' + limit);
  return lsGet(RV_LOCAL).slice().sort((a, b) => b.dibuat.localeCompare(a.dibuat));
}
async function postReview(row) { if (rvOnline()) return sbReq('ulasan', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(row) }); const a = lsGet(RV_LOCAL); a.push(Object.assign({ id: Date.now(), dibuat: new Date().toISOString() }, row)); lsSet(RV_LOCAL, a); }
async function postSaran(row) { if (rvOnline()) return sbReq('saran', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(row) }); const a = lsGet(SR_LOCAL); a.push(Object.assign({ dibuat: new Date().toISOString() }, row)); lsSet(SR_LOCAL, a); }
const STAR_LBL = ['', 'Kurang', 'Lumayan', 'Bagus', 'Keren', 'Mantap!'];
const starTxt = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);
function ago(iso) { const s2 = (Date.now() - new Date(iso).getTime()) / 1000; if (s2 < 60) return 'baru saja'; if (s2 < 3600) return Math.floor(s2 / 60) + ' menit lalu'; if (s2 < 86400) return Math.floor(s2 / 3600) + ' jam lalu'; if (s2 < 86400 * 30) return Math.floor(s2 / 86400) + ' hari lalu'; return tgl(iso); }
const skinFor = (name) => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return SKINS[h % SKINS.length]; };
let RV = { tab: 'ulasan', list: null, shown: 12, star: 0, err: '' };
function renderUlasan() {
  const v = $('#v-ulasan');
  const local = !rvOnline();
  v.innerHTML = `<div class="page rvpage">
    <div class="rvhead"><div><h2>Ulasan & Kotak Saran</h2><p class="lead">Ceritakan pengalamanmu belajar bareng Kancil. Ulasan bisa dibaca pemain lain, sedangkan saran langsung sampai ke pembuat game.</p></div>
      <div class="segtabs" role="tablist"><button role="tab" data-t="ulasan" class="${RV.tab === 'ulasan' ? 'on' : ''}">💬 Ulasan</button><button role="tab" data-t="saran" class="${RV.tab === 'saran' ? 'on' : ''}">📮 Kotak saran</button></div></div>
    ${local ? `<div class="rvnote"><b>Mode contoh.</b> Untuk sementara, ulasan dan saran hanya tersimpan di perangkat ini.</div>` : ''}
    <div id="rvBody"></div></div>`;
  v.querySelectorAll('.segtabs button').forEach(b => b.onclick = () => { RV.tab = b.dataset.t; SFX.click(); renderUlasan(); });
  if (RV.tab === 'saran') renderSaranForm(); else renderReviewTab();
}
function reviewItem(r) {
  return `<article class="rvitem"><canvas data-skin="${esc(skinFor(r.nama).id)}" aria-hidden="true"></canvas><div class="rvmain"><div class="rvtop"><b>${esc(r.nama)}</b><span class="rvstars" aria-label="${r.bintang} dari 5 bintang">${starTxt(r.bintang)}</span><time>${esc(ago(r.dibuat))}</time></div><p>${esc(r.komentar)}</p></div></article>`;
}
function paintReviewAvatars(root) { root.querySelectorAll('canvas[data-skin]').forEach(cv => paint(cv, KANCIL_HAPPY, 16, 16, SKINS.find(k => k.id === cv.dataset.skin))); }
async function renderReviewTab() {
  const body = $('#rvBody'); if (!body) return;
  body.innerHTML = `<div class="rvgrid">
    <section class="card rvsum" id="rvSum"><div class="body"><div class="dots"><i></i><i></i><i></i></div></div></section>
    <section class="card"><h3>Tulis ulasan</h3><form class="body rvform" id="rvForm" novalidate>
      <label for="rvName">Nama<input id="rvName" maxlength="30" value="${esc((S.name || '').trim())}" placeholder="Nama atau nama panggilan" autocomplete="nickname"></label>
      <div class="lbl">Nilai</div><div class="starpick" role="radiogroup" aria-label="Pilih bintang">${[1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" data-n="${n}" aria-label="${n} bintang, ${STAR_LBL[n]}" aria-checked="${RV.star === n}">★</button>`).join('')}<span id="starLbl">${RV.star ? STAR_LBL[RV.star] : 'Ketuk bintang'}</span></div>
      <label for="rvText">Komentar<textarea id="rvText" maxlength="500" rows="4" placeholder="Apa yang kamu suka? Bagian mana yang paling membantu?"></textarea><small class="cnt" id="rvCnt">0/500</small></label>
      <input type="text" id="rvHp" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
      <div class="rvact"><button class="px gold" id="rvSend" type="submit">Kirim ulasan</button><span class="rverr" id="rvErr" role="status"></span></div>
    </form></section></div>
    <h3 class="rvlisth">Ulasan terbaru</h3><div class="rvlist" id="rvList"><div class="dots"><i></i><i></i><i></i></div></div>`;
  const setStar = (n) => { RV.star = n; body.querySelectorAll('.starpick button').forEach(b => { const on = +b.dataset.n <= n; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(+b.dataset.n === n)); }); $('#starLbl').textContent = STAR_LBL[n]; };
  body.querySelectorAll('.starpick button').forEach(b => { b.onclick = () => { setStar(+b.dataset.n); tone(500 + +b.dataset.n * 110, 0.07, { vol: 0.05 }); }; });
  if (RV.star) setStar(RV.star);
  const ta = $('#rvText'); ta.addEventListener('input', () => { $('#rvCnt').textContent = ta.value.length + '/500'; });
  $('#rvForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const err = $('#rvErr');
    const nama = $('#rvName').value.trim().replace(/\s+/g, ' '), komentar = ta.value.trim().replace(/\n{3,}/g, '\n\n');
    if ($('#rvHp').value) return;
    if (!nama) { err.textContent = 'Isi namamu dulu, ya.'; $('#rvName').focus(); SFX.bad(); return; }
    if (!RV.star) { err.textContent = 'Pilih jumlah bintang dulu.'; SFX.bad(); return; }
    if (komentar.length < 3) { err.textContent = 'Komentarnya minimal 3 huruf.'; ta.focus(); SFX.bad(); return; }
    const wait = (S.lastReview || 0) + 10 * 60 * 1000 - Date.now();
    if (wait > 0) { err.textContent = 'Kamu baru saja mengirim ulasan. Coba lagi ' + Math.ceil(wait / 60000) + ' menit lagi.'; SFX.bad(); return; }
    const btn = $('#rvSend'); btn.disabled = true; btn.textContent = 'Mengirim…'; err.textContent = '';
    try {
      await postReview({ nama: nama.slice(0, 30), bintang: RV.star, komentar: komentar.slice(0, 500) });
      S.lastReview = Date.now(); if (!S.name) S.name = nama; save();
      SFX.good(); confetti(); toast('Terima kasih atas ulasanmu!');
      RV.star = 0; RV.list = null; renderReviewTab();
    } catch (ex) { btn.disabled = false; btn.textContent = 'Kirim ulasan'; err.textContent = 'Ulasan belum terkirim. Cek internetmu lalu coba lagi.'; SFX.bad(); }
  });
  try { if (!RV.list) RV.list = await fetchReviews(); RV.err = ''; } catch (ex) { RV.list = []; RV.err = 'Ulasan belum bisa dimuat. Cek internetmu lalu buka halaman ini lagi.'; }
  if (!$('#rvList')) return;
  const L = RV.list; const n = L.length; const avg = n ? L.reduce((a, r) => a + r.bintang, 0) / n : 0;
  const dist = [5, 4, 3, 2, 1].map(k => [k, L.filter(r => r.bintang === k).length]);
  $('#rvSum').innerHTML = `<div class="body"><div class="avg"><b>${n ? avg.toFixed(1).replace('.', ',') : '–'}</b><div><span class="rvstars big">${starTxt(Math.round(avg))}</span><small>${n ? n + ' ulasan' : 'Belum ada ulasan'}</small></div></div>
    <div class="dist">${dist.map(([k, c]) => `<div><span>${k}★</span><i><i style="width:${n ? c / n * 100 : 0}%"></i></i><em>${c}</em></div>`).join('')}</div></div>`;
  const listEl = $('#rvList');
  if (RV.err) { listEl.innerHTML = `<p class="rvempty">${esc(RV.err)}</p>`; return; }
  if (!n) { listEl.innerHTML = '<p class="rvempty">Belum ada ulasan. Jadilah yang pertama memberi ulasan!</p>'; return; }
  listEl.innerHTML = L.slice(0, RV.shown).map(reviewItem).join('') + (n > RV.shown ? '<button class="px" id="rvMore">Tampilkan lebih banyak</button>' : '');
  paintReviewAvatars(listEl);
  const more = $('#rvMore'); if (more) more.onclick = () => { RV.shown += 12; renderReviewTab(); };
}
function renderSaranForm(sent) {
  const body = $('#rvBody'); if (!body) return;
  if (sent) { body.innerHTML = `<section class="card"><div class="body rvsent"><canvas id="srAva"></canvas><h3>Terima kasih!</h3><p>Saranmu sudah sampai ke pembuat game. Saran tidak ditampilkan ke publik.</p><button class="px gold" id="srAgain">Kirim saran lain</button></div></section>`; paint($('#srAva'), KANCIL_HAPPY); $('#srAgain').onclick = () => renderSaranForm(); return; }
  const KAT = [['materi', '📘 Materi'], ['bug', '🐞 Ada error'], ['fitur', '✨ Ide fitur'], ['lainnya', '💭 Lainnya']];
  body.innerHTML = `<section class="card"><h3>Kotak saran</h3><form class="body rvform" id="srForm" novalidate>
    <p class="certtip" style="margin:0">Punya ide, menemukan error, atau ada materi yang membingungkan? Tulis di sini. Hanya pembuat game yang bisa membaca saranmu.</p>
    <div class="lbl">Tentang apa?</div><div class="katpick" role="radiogroup">${KAT.map(([k, l], i) => `<button type="button" role="radio" data-k="${k}" class="${i === 0 ? 'on' : ''}" aria-checked="${i === 0}">${l}</button>`).join('')}</div>
    <label for="srText">Saranmu<textarea id="srText" maxlength="1000" rows="5" placeholder="Contoh: Materi perulangan sebaiknya ada contoh tambahan…"></textarea><small class="cnt" id="srCnt">0/1000</small></label>
    <div class="row2"><label for="srName">Nama (opsional)<input id="srName" maxlength="30" value="${esc((S.name || '').trim())}"></label><label for="srKontak">Kontak kalau mau dibalas (opsional)<input id="srKontak" maxlength="80" placeholder="email atau @instagram"></label></div>
    <input type="text" id="srHp" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
    <div class="rvact"><button class="px gold" id="srSend" type="submit">Kirim saran</button><span class="rverr" id="srErr" role="status"></span></div>
  </form></section>`;
  let kat = 'materi';
  body.querySelectorAll('.katpick button').forEach(b => b.onclick = () => { kat = b.dataset.k; body.querySelectorAll('.katpick button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); }); SFX.click(); });
  const ta = $('#srText'); ta.addEventListener('input', () => { $('#srCnt').textContent = ta.value.length + '/1000'; });
  $('#srForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const err = $('#srErr');
    if ($('#srHp').value) return;
    const pesan = ta.value.trim();
    if (pesan.length < 5) { err.textContent = 'Saranmu minimal 5 huruf.'; ta.focus(); SFX.bad(); return; }
    const wait = (S.lastSaran || 0) + 2 * 60 * 1000 - Date.now();
    if (wait > 0) { err.textContent = 'Tunggu sebentar sebelum mengirim saran lagi.'; SFX.bad(); return; }
    const btn = $('#srSend'); btn.disabled = true; btn.textContent = 'Mengirim…'; err.textContent = '';
    try {
      await postSaran({ kategori: kat, pesan: pesan.slice(0, 1000), nama: $('#srName').value.trim().slice(0, 30) || null, kontak: $('#srKontak').value.trim().slice(0, 80) || null });
      S.lastSaran = Date.now(); save(); SFX.good(); renderSaranForm(true);
    } catch (ex) { btn.disabled = false; btn.textContent = 'Kirim saran'; err.textContent = 'Saran belum terkirim. Cek internetmu lalu coba lagi.'; SFX.bad(); }
  });
}
async function loadHelloReviews() {
  const box = $('#helloReviews'); if (!box || !rvOnline()) return;
  try {
    const L = await sbReq('ulasan?select=nama,bintang,komentar,dibuat&bintang=gte.4&order=dibuat.desc&limit=3');
    if (!L || !L.length || !$('#helloReviews')) return;
    box.hidden = false;
    box.innerHTML = `<div class="secttl">Kata para pemain</div><div class="hrv">${L.map(r => `<figure><canvas data-skin="${esc(skinFor(r.nama).id)}" aria-hidden="true"></canvas><blockquote>${esc(r.komentar.length > 160 ? r.komentar.slice(0, 157) + '…' : r.komentar)}</blockquote><figcaption><span class="rvstars">${starTxt(r.bintang)}</span> ${esc(r.nama)}</figcaption></figure>`).join('')}</div><div class="heroBtns center"><button class="px" id="hRv">Lihat semua ulasan</button></div>`;
    paintReviewAvatars(box);
    $('#hRv').onclick = () => { S.intro = true; save(); go('ulasan'); };
  } catch (_) {}
}

/* ================= routing ================= */
function show(name) {
  ['dash', 'peta', 'lesson', 'arena', 'bebas', 'kamus', 'kilat', 'sambut', 'ulasan'].forEach(n => { $('#v-' + n).hidden = n !== name; });
  const navName = name === 'lesson' ? 'peta' : name;
  document.body.dataset.view = name;
  document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === navName));
  const tm = $('#tbMore'); if (tm) tm.classList.toggle('on', ['bebas', 'kamus', 'ulasan'].includes(navName));
  if (name !== 'peta') $('#stage').scrollTop = 0;
}
function go(name) {
  setMore(false);
  stopKilat(); const ob = $('#kbubble'); if (ob) ob.remove();
  if (typer) { clearInterval(typer.id); typer = null; }
  show(name);
  if (name === 'peta') renderMap();
  if (name === 'dash') renderHome();
  if (name === 'ulasan') renderUlasan();
  if (name === 'arena') renderBadges();
  if (name === 'bebas') renderFree();
  if (name === 'kamus') renderCheat();
  if (name === 'kilat') renderKilat();
  if (name === 'sambut') renderSambut();
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
function setMore(open) { const ms = $('#moreSheet'), tm = $('#tbMore'); if (!ms) return; ms.hidden = !open; tm.setAttribute('aria-expanded', String(open)); if (open) { const f = ms.querySelector('button'); if (f) f.focus(); } }
$('#tbMore').onclick = () => { SFX.click(); setMore($('#moreSheet').hidden); };
$('#msBack').onclick = () => setMore(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#moreSheet').hidden) { setMore(false); $('#tbMore').focus(); } });

/* ================= boot ================= */
document.querySelectorAll('.toptabs button').forEach(b => { b.title = b.textContent.trim(); });
document.querySelectorAll('.yr').forEach(e => { e.textContent = new Date().getFullYear(); });
renderHUD(); go('dash');
const chm = /^#tantang-(\d{1,3})(?:-([a-z0-9-]{1,24}))?$/i.exec(location.hash || '');
if (chm) { challengeTarget = +chm[1]; if (chm[2]) challengeFrom = chm[2].split('-').filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' '); }
if (!S.intro || location.hash === '#sambut') {
  go('sambut');
} else if (chm) {
  modal({ sprite: KANCIL_HAPPY, title: 'Ada tantangan!', text: esc(challengeFrom) + ' dapat skor <b>' + challengeTarget + '</b> di Kuis Kilat. Tebak output kode PHP secepat mungkin dalam 60 detik. Berani kalahkan?', btn: 'Terima tantangan', onClose: () => go('kilat'), extra: '<p style="margin:-4px 0 12px;font-family:var(--f-dlg);font-size:19px;color:var(--muted)">Belum bisa PHP? Tenang, kamu bisa belajar dari nol di menu Petualangan.</p>' });
}
})();
</script>
